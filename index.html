<html lang="pt-BR">
<head>

<style>
:root {
  --brand: #0F766E; --on-brand: #fff;
  --side: color-mix(in srgb, var(--brand) 16%, #0B1220);
  --side-2: color-mix(in srgb, var(--brand) 26%, #0F172A);
  --ink: #0F172A; --ink-2: #334155; --muted: #64748B;
  --line: #E2E8F0; --line-2: #CBD5E1; --bg: #F4F6FA; --card: #fff;
  --radius: 12px; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.05);

  --green: #16A34A; --green-bg: #DCFCE7; --green-tx: #166534;
  --red: #DC2626;   --red-bg: #FEE2E2;   --red-tx: #991B1B;
  --amber-bg: #FEF3C7; --amber-tx: #92400E;
  --blue-bg: #DBEAFE;  --blue-tx: #1E40AF;
  --violet-bg: #EDE9FE; --violet-tx: #5B21B6;
  --rose-bg: #FFE4E6; --rose-tx: #BE123C;
  --teal-bg: #CCFBF1; --teal-tx: #0F766E;
  --gray-bg: #F1F5F9; --gray-tx: #64748B;
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
body { font: 14px/1.45 Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: clip; }
button, input, select, textarea { font: inherit; }

/* ---------- Tela de Login ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; align-content: center; gap: 18px; padding: 24px 16px; background: #F5F3EE; position: relative; overflow: hidden; }
.login-wrap::before, .login-wrap::after { content: ""; position: absolute; width: 180px; height: 180px; border-radius: 44px; opacity: .10; pointer-events: none; }
.login-wrap::before { background: #0F766E; top: -50px; left: -40px; box-shadow: 210px 0 0 #0F766E; }
.login-wrap::after { background: #F2B33D; bottom: -60px; right: -50px; opacity: .22; }
.login-box { background: #fff; border-radius: 20px; width: 100%; max-width: 400px; padding: 28px; box-shadow: 0 1px 2px rgba(16,32,30,.06), 0 18px 40px rgba(16,32,30,.10); display: grid; gap: 16px; position: relative; z-index: 1; }
.login-box .btn-primary { background: #0F766E; border-radius: 12px; }
.login-logo { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 2px 0 6px; }
.login-logo .marca { display: flex; align-items: center; gap: 14px; }
.login-logo svg { width: 92px; height: auto; }
.login-logo img { height: 52px; width: auto; }
.login-logo .slogan { font-size: 13px; color: #4B5E5B; letter-spacing: .2px; }
.login-cells { display: flex; gap: 6px; justify-content: center; position: relative; z-index: 1; }
.login-cells i { width: 14px; height: 14px; border-radius: 4px; background: #0F766E; opacity: .85; }
.login-cells i:nth-child(3n) { background: #F2B33D; }
.login-rodape { font-size: 11.5px; color: #6B7C79; position: relative; z-index: 1; }
.selo-eskla { position: fixed; right: 14px; bottom: 10px; display: flex; align-items: center; gap: 6px; opacity: .45; pointer-events: none; z-index: 30; }
.selo-eskla svg { width: 34px; height: auto; }
.selo-eskla img { height: 17px; width: auto; }
@media screen and (max-width: 900px) { .selo-eskla { right: 8px; bottom: 6px; opacity: .3; } .selo-eskla svg { width: 24px; } .selo-eskla img { height: 12px; } }
.login-brand { display: flex; align-items: center; gap: 12px; }
.login-brand .logo { width: 44px; height: 44px; font-size: 16px; }
.login-box h1 { margin: 0; font-size: 19px; letter-spacing: -.3px; }
.login-box p { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); }
.login-hint { background: #F8FAFC; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12px; color: var(--ink-2); line-height: 1.5; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: 262px minmax(0,1fr); min-height: 100vh; transition: grid-template-columns .2s ease; }
body.side-mini .app { grid-template-columns: 72px minmax(0,1fr); }

.sidebar { background: var(--side); color: #CBD5E1; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; z-index: 40; }
.side-scroll { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex-shrink: 0; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-txt { overflow: hidden; }
.brand-name { color: #fff; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: #94A3B8; line-height: 1.35; }
.emp-switch { display: flex; gap: 6px; }
.emp-switch select { flex: 1; background: var(--side-2); color: #E2E8F0; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 7px 8px; font-size: 12.5px; }
.emp-switch button { background: var(--side-2); color: #E2E8F0; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; width: 34px; padding: 0; justify-content: center; font-size: 17px; }
.nav-group { display: grid; gap: 2px; }
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #64748B; padding: 4px 10px; white-space: nowrap; }
.hora-input { width: 84px; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }
.cfg-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.cfg-tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--ink-2, #475569); cursor: pointer; border-radius: 8px 8px 0 0; }
.cfg-tab:hover { background: rgba(100,116,139,.08); }
.cfg-tab.on { color: var(--brand); border-bottom-color: var(--brand); }
.cell.travado { cursor: not-allowed; }
.cfg-subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.cfg-subtab { background: var(--gray-bg); border: 1px solid var(--line); padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-radius: 999px; }
.cfg-subtab:hover { border-color: var(--line-2); }
.cfg-subtab.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.cfg-avisos ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
.cfg-avisos li.err { color: #B91C1C; } .cfg-avisos li.warn { color: #B45309; } .cfg-avisos li.info { color: #475569; }
.nav-acc-btn { display: flex; align-items: center; justify-content: space-between; width: 100%; background: rgba(255,255,255,.04); color: #E2E8F0; border: 1px solid rgba(255,255,255,.07); padding: 8px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; cursor: pointer; text-align: left; }
.nav-acc-btn:hover { background: var(--side-2); color: #fff; }
.nav-acc-btn .chev { transition: transform .18s ease; font-size: 12px; }
.nav-acc-btn.open .chev { transform: rotate(90deg); }
.nav-sub { display: grid; gap: 2px; padding-left: 6px; margin-top: 2px; }
.nav-sub.collapsed { display: none; }
.nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; background: transparent; color: #CBD5E1; border: 0; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left; white-space: nowrap; }
.nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
.nav-btn:hover { background: var(--side-2); color: #fff; }
.nav-btn.active { background: color-mix(in srgb, var(--brand) 55%, transparent); color: #fff; }
.nav-btn .count { margin-left: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 1px 7px; font-weight: 700; }
.side-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); display: grid; gap: 8px; }
.user-pill { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--side-2); border-radius: 9px; padding: 8px 10px; font-size: 12px; color: #E2E8F0; }
.user-pill small { display: block; color: #94A3B8; font-size: 10.5px; }
.user-pill button { background: rgba(255,255,255,.08); color: #fff; border: 0; padding: 5px 9px; font-size: 11.5px; border-radius: 7px; }
.rule-chip { background: var(--side-2); border-radius: 9px; padding: 10px 12px; font-size: 11.5px; color: #94A3B8; line-height: 1.5; }
.rule-chip strong { color: #E2E8F0; display: block; font-size: 12px; }
.plan { font-size: 11px; color: #94A3B8; padding: 0 4px; white-space: nowrap; }
body.side-mini .brand-txt, body.side-mini .nav-label, body.side-mini .nav-btn span, body.side-mini .emp-switch, body.side-mini .side-foot, body.side-mini .nav-btn .count, body.side-mini .nav-acc-btn span:first-child { display: none; }
body.side-mini .nav-btn, body.side-mini .nav-acc-btn { justify-content: center; }
body.side-mini .brand { justify-content: center; }
body.side-mini .nav-sub { padding-left: 0; }

.content { display: flex; flex-direction: column; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,246,250,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.icon-btn { width: 38px; height: 38px; padding: 0; justify-content: center; background: #fff; border: 1px solid var(--line-2); color: var(--ink-2); }
.icon-btn svg { width: 18px; height: 18px; }
.top-title { flex: 1; min-width: 180px; }
.top-title h1 { margin: 0; font-size: 18px; letter-spacing: -.3px; }
.top-title p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
.month-nav { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; }
.month-nav button { background: transparent; border: 0; width: 32px; height: 32px; padding: 0; justify-content: center; color: var(--ink-2); font-size: 16px; }
.month-nav button:hover { background: var(--gray-bg); }
.month-nav .lbl { font-weight: 700; font-size: 13.5px; min-width: 128px; text-align: center; text-transform: capitalize; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
main { padding: 22px 24px 60px; display: grid; gap: 18px; max-width: 1640px; width: 100%; }
.overlay { display: none; }

/* ---------- Componentes ---------- */
button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, filter .15s; }
button:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { filter: brightness(.92); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-ghost { background: #fff; color: var(--ink-2); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--gray-bg); }
.btn-danger { background: #fff; color: var(--red-tx); border-color: #FECACA; }
.btn-danger:hover { background: #FEF2F2; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
.btn-wa { background: #16A34A; color: #fff; }
.btn-wa:hover { background: #15803D; }
a.btn-wa { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.card-h h2 { margin: 0; font-size: 15px; letter-spacing: -.2px; }
.card-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-h .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.span-2 { grid-column: span 2; }
@media (max-width: 700px) { .span-2 { grid-column: auto; } }

.field { display: flex; flex-direction: column; gap: 5px; }
label, .lbl-f { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.help { font-size: 11.5px; color: var(--muted); font-weight: 400; line-height: 1.4; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; color: var(--ink); font-size: 13.5px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
input[type=color] { padding: 2px; height: 38px; width: 56px; }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--brand); margin: 0; flex-shrink: 0; }
input.invalid { border-color: var(--red); }
textarea { resize: vertical; min-height: 150px; line-height: 1.5; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: #F8FAFC; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { margin-top: 2px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th { background: #F8FAFC; color: var(--muted); text-align: left; padding: 9px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; border-bottom: 1px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input, td select { padding: 6px 8px; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px !important; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.b-green { background: var(--green-bg); color: var(--green-tx); }
.b-red { background: var(--red-bg); color: var(--red-tx); }
.b-amber { background: var(--amber-bg); color: var(--amber-tx); }
.b-blue { background: var(--blue-bg); color: var(--blue-tx); }
.b-gray { background: var(--gray-bg); color: var(--gray-tx); }
.b-teal { background: var(--teal-bg); color: var(--teal-tx); }

.toggle { border: 0; border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 12px; font-weight: 700; gap: 7px; }
.toggle.on { background: var(--green-bg); color: var(--green-tx); }
.toggle.off { background: var(--red-bg); color: var(--red-tx); }
.toggle.warn-t { background: var(--amber-bg); color: var(--amber-tx); }
.toggle .knob { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

.turno-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.turno-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-bg); color: var(--blue-tx); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 650; }
.turno-chip button { border: 0; background: transparent; color: inherit; padding: 0; font-size: 14px; line-height: 1; cursor: pointer; font-weight: 800; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 14px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); border-top: 3px solid var(--line-2); }
.kpi-l { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi-v { font-size: clamp(22px, 2.4vw, 28px); font-weight: 800; letter-spacing: -.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi-h { font-size: 12px; color: var(--muted); }
.kpi.ok { border-top-color: var(--green); } .kpi.ok .kpi-v { color: var(--green-tx); }
.kpi.warn { border-top-color: #F59E0B; } .kpi.warn .kpi-v { color: #B45309; }
.kpi.bad { border-top-color: var(--red); } .kpi.bad .kpi-v { color: var(--red-tx); }
.kpi.kb { border-top-color: var(--brand); }

.s-trab { background: var(--green-bg); color: var(--green-tx); }
.s-fertrab { background: #BBF7D0; color: #14532D; box-shadow: inset 0 0 0 2px #60A5FA; }
.s-ferpago { background: #A7F3D0; color: #064E3B; box-shadow: inset 0 0 0 2px #34D399; }
.s-folga { background: var(--amber-bg); color: var(--amber-tx); }
.s-feriado { background: var(--blue-bg); color: var(--blue-tx); }
.s-comp { background: var(--teal-bg); color: var(--teal-tx); }
.s-fechado { background: #FEF2F2; color: #B91C1C; }
details.ex { margin-top: 6px; font-size: 12px; color: var(--ink-2); font-weight: 400; }
details.ex > summary { cursor: pointer; color: var(--brand); font-weight: 600; list-style: none; display: inline-flex; align-items: center; gap: 5px; user-select: none; }
details.ex > summary::-webkit-details-marker { display: none; }
details.ex > summary::before { content: "▸"; display: inline-block; transition: transform .15s; }
details.ex[open] > summary::before { transform: rotate(90deg); }
details.ex > div { margin-top: 6px; padding: 9px 11px; background: var(--gray-bg); border: 1px solid var(--line); border-radius: 8px; line-height: 1.55; }
details.ex ul, details.ex ol { margin: 4px 0 0; padding-left: 18px; }
.s-fora { background: repeating-linear-gradient(45deg, #F1F5F9, #F1F5F9 4px, #E2E8F0 4px, #E2E8F0 8px); color: #94A3B8; }
.s-ferias { background: var(--violet-bg); color: var(--violet-tx); }
.s-afast { background: var(--rose-bg); color: var(--rose-tx); }
.s-falta { background: #FED7AA; color: #9A3412; }
.s-rest { background: #E9D5FF; color: #6B21A8; }

.grade th, .grade td { padding: 4px 3px; text-align: center; }
.grade th:first-child, .grade td:first-child { position: sticky; left: 0; z-index: 2; background: #fff; text-align: left; padding: 6px 12px; min-width: 174px; border-right: 1px solid var(--line); }
.grade th:first-child { background: #F8FAFC; }
.grade tfoot td:first-child { background: #F8FAFC; }
.grade th.d { min-width: 66px; line-height: 1.15; }
.grade th.d b { display: block; font-size: 13px; color: var(--ink); }
.grade th.d small { font-size: 10px; }

        const reqFn = minimoFuncaoNoDia(fn, ev);
        if (reqFn <= 0) return;
        let pegos = 0;
        if (filaPorFuncao) {
          // Fila da função: quem é da função reveza só entre si; a vez continua de onde parou no último domingo/feriado.
          const ff = filaFn(fn.id), nf = ff.length;
          if (!nf) return;
          const p0 = ptrFn[fn.id] || 0;
          const rot = ff.map((_, i) => ff[modN(p0 + i, nf)]);
          const ok = new Set(elegiveis.map(c => c.id));
          let maxPos = -1;
          for (const c of priorizar(rot.filter(c => ok.has(c.id)))) {
            if (pegos >= reqFn) break;
            if (!escolhidos.has(c.id)) { escolhidos.add(c.id); pegos++; maxPos = Math.max(maxPos, rot.indexOf(c)); }
          }
          if (maxPos >= 0) ptrFn[fn.id] = p0 + maxPos + 1;
          return;
        }
        for (const c of elegiveis) {
          if (pegos >= reqFn) break;
          if (funcaoDoCol(c)?.id === fn.id && !escolhidos.has(c.id)) { escolhidos.add(c.id); pegos++; }
        }
      });
      for (const c of elegiveis) { if (escolhidos.size >= req) break; escolhidos.add(c.id); }
      ultimosDomFer.clear();
      equipe.forEach(c => {
        if (!livre(c, ev)) return;
        if (escolhidos.has(c.id)) {
          setDuty(c, ev, domNormal ? "TRAB" : statusTrabalhoDia(ev));
          ultimosDomFer.add(c.id);
          if (domNormal) domTrab.add(c.id);
        } else G[c.id][ev.iso] = { st: domNormal ? "FOLGA" : "FER_FOLGA" };
      });
      if (domNormal) contarDomingo(ev.iso, new Set(equipe.filter(c => duty[c.id]?.[ev.iso] || ehTrab(G[c.id][ev.iso])).map(c => c.id)));
      domFerEventoIdx++;
    });

    // 2b) Quem trabalhou no domingo tem PREFERÊNCIA pela folga no sábado. Ela não é fixada aqui: entra como uma das folgas
    //     da semana (a primeira candidata) e cede se o limite de dias seguidos ou os mínimos exigirem outro dia.
    //     Assim a semana nunca passa das folgas configuradas só por causa dessa regra.
    const sab = sem.find(d => d.dow === 6);
    const sabIdx = sem.findIndex(d => d.dow === 6);
    const prefSab = new Set();
    if (sab && R.folgaSabadoAposDomingo && domTrab.size > 0 && diaPermiteFolga(sab)) domTrab.forEach(cid => { const c = colById(cid); if (c && livre(c, sab)) prefSab.add(cid); });

    // 2d) Folgas semanais: rodízio pela fila, sem estourar o máximo de dias seguidos (inclusive entre semanas)
    const filaSemana = filaRotacionada(idxDomSemana ?? idxIniSemana).filter(c => sem.some(d => G[c.id][d.iso]?.st !== "FORA"));   // quem está fora do contrato a semana toda não ocupa posição
    const posFila = new Map(filaSemana.map((c, i) => [c.id, i]));
    const needs = [], anivExtra = [];
    equipe.forEach(c => {
      const disp = sem.filter(d => !["FERIAS", "AFAST", "FORA"].includes(G[c.id][d.iso]?.st)).length;
      if (!disp) return;
      let precisa = Math.round((Number(R.folgasSemana) || 2) * disp / 7);
      precisa -= sem.filter(d => {
        const s = G[c.id][d.iso]?.st;
        if (s === "FECHADO") return true;
        if (s === "FOLGA") return (d.dow !== 0 || R.domingoContaFolgaSemana);
        if (s === "FER_FOLGA" && R.priorizarFeriadoFolga) return true;
        return false;
      }).length;
      if (precisa <= 0) {
        // Já tem as folgas da semana (ex.: folga de feriado + sábado), mas pode estourar o máximo de dias seguidos
        // ao somar o fim da semana anterior: pede uma folga extra para quebrar a corrida.
        let run = tailAntes(c), mx = 0;
        sem.forEach(d => { if (!G[c.id][d.iso] || ehTrab(G[c.id][d.iso])) { run++; if (run > mx) mx = run; } else run = 0; });
        const trabSem = sem.filter(d => !G[c.id][d.iso]).length;
        if (mx > maxDiasCfg && trabSem > 1) precisa = 1;
      }
      // Aniversário: se o feriado da semana já ocupou a folga (priorizar feriado), o aniversário vira folga a mais.
      const bd = anivSem[c.id];
      if (bd && precisa <= 0 && !G[c.id][bd.iso] && R.priorizarFeriadoFolga && sem.some(d => G[c.id][d.iso]?.st === "FER_FOLGA")) anivExtra.push({ c, d: bd });
      if (precisa > 0) needs.push({ c, k: precisa, j: posFila.has(c.id) ? posFila.get(c.id) : 99 });
    });
    // Aniversariantes escolhem primeiro, para o dia do aniversário não ser ocupado antes pelas folgas dos outros.
    needs.sort((a, b) => (anivSem[b.c.id] ? 1 : 0) - (anivSem[a.c.id] ? 1 : 0) || a.j - b.j);
    const extraNeeds = anivExtra.map(({ c, d }) => ({ c, k: 1, j: -1, extra: true, bdIdx: sem.indexOf(d) }));

    if (needs.length || extraNeeds.length) {
      const permiteDia = sem.map(d => diaPermiteFolga(d));
      const capDia = sem.map(d => maxFolgasPermitidasNoDia(d, nEqDia(d)));
      const minDia = sem.map(d => minimoDiaEsperado(d));
      const folgaIni = sem.map(d => folgasNoDia(d));
      const ativoIni = sem.map(d => ativosNoDia(d));
      const fnIni = sem.map(d => { const o = {}; E.funcoes.forEach(fn => { o[fn.id] = equipe.filter(x => funcaoDoCol(x)?.id === fn.id && !G[x.id][d.iso]).length; }); return o; });
      const rankDia = (j, i) => {
        const dow = sem[i].dow, pos = prefDias.indexOf(dow);
        if (pos >= 0) return modN(pos - modN(j, prefDias.length), prefDias.length);
        return prefDias.length + (dow === 6 ? 0 : dow === 0 ? 1 : 2);
      };
      [...needs, ...extraNeeds].forEach(n => {
        n.cand = [];
        // Dias com folga bloqueada entram no fim da lista: só são usados no nível que libera o bloqueio para não estourar os dias seguidos.
        sem.forEach((d, i) => { if (!G[n.c.id][d.iso] && !duty[n.c.id]?.[d.iso] && (permiteDia[i] || d.aberto)) n.cand.push(i); });
        // Dia curto (a loja abre menos horas do que a jornada da pessoa, ex.: sábado só de manhã): a folga vai de preferência
        // pra ele, assim a semana fecha a carga trabalhando nos dias inteiros.
        const hDia = horasDiaCol(n.c, R);
        const curto = i => { const cf = sem[i].cfg || {}, ab = toMin(cf.abertura), fe = toMin(cf.fechamento); if (ab == null || fe == null || fe <= ab) return false; const ls = toMin(cf.almocoSaida), lr = toMin(cf.almocoRetorno); const util = (fe - ab) - (ls != null && lr != null && lr > ls ? lr - ls : 0); return util / 60 < hDia - 0.01; };
        const rk = i => !permiteDia[i] ? 1000 : (anivSem[n.c.id] && sem[i].iso === anivSem[n.c.id].iso) ? -100 : (prefSab.has(n.c.id) && i === sabIdx) ? -99 : curto(i) ? -50 + rankDia(n.j, i) / 100 : rankDia(n.j, i);
        n.cand.sort((a, b) => rk(a) - rk(b) || a - b);
        if (n.extra) n.cand = n.cand.filter(i => i === n.bdIdx && permiteDia[i]);
        n.k = Math.min(n.k, n.cand.length);
        n.tail = tailAntes(n.c);
        n.base = sem.map(d => !G[n.c.id][d.iso] || ehTrab(G[n.c.id][d.iso]));   // true = trabalha (por enquanto; inclui dia fechado trabalhado)
      });
      const posProx = (() => {
        const domProx = semProx.find(d => d.dow === 0 && d.aberto && !d.fer);
        if (!domProx || !baseFila.length) return null;
        const pw = baseFila[modN(ptrEm(domProx.iso), baseFila.length)];
        let p = null;
        for (let i = 0; i < semProx.length; i++) { if (semProx[i].dow !== 0 && semProx[i].aberto && diaPermiteFolga(semProx[i])) { p = i; break; } }
        return p == null ? null : { id: pw.id, pos: p };
      })();

      const tentar = (nivel, lista = needs) => {
        const folgaCnt = folgaIni.slice(), ativoCnt = ativoIni.slice(), fnCnt = fnIni.map(o => ({ ...o }));
        const escolha = new Map();
        let nos = 0;
        const LIMITE = 30000;
        const okDia = (n, i) => {
          if (!permiteDia[i]) { if (!nivel.liberaBloqueio || folgaCnt[i] - folgaIni[i] >= 1) return false; }
          else if (!nivel.semTeto && folgaCnt[i] >= capDia[i]) return false;
          if (nivel.minGeral && ativoCnt[i] - 1 < minDia[i]) return false;
          if (nivel.minFn) {
            const fn = funcaoDoCol(n.c), reqFn = minimoFuncaoNoDia(fn, sem[i]);
            if (fn && reqFn > 0 && fnCnt[i][fn.id] - 1 < reqFn) return false;
          }
          return true;
        };
        const corridaOk = (n, comb) => {
          const work = n.base.map((v, i) => v && !comb.includes(i));
          let run = n.tail, mx = 0;
          for (let i = 0; i < 7; i++) { if (work[i]) { run++; if (run > mx) mx = run; } else run = 0; }
          if (mx > nivel.lim) return false;
          if (nivel.look && posProx && posProx.id === n.c.id && run + posProx.pos > nivel.lim) return false;
          return true;
        };
        const aplicar = (n, comb, s) => comb.forEach(i => { folgaCnt[i] += s; ativoCnt[i] -= s; const fn = funcaoDoCol(n.c); if (fn) fnCnt[i][fn.id] -= s; });
        const dfs = p => {
          if (p === lista.length) return true;
          const n = lista[p];
          if (n.k === 0) return dfs(p + 1);
          const comb = [];
          const pick = (start, resta) => {
            if (++nos > LIMITE) return false;
            if (resta === 0) {
              if (!corridaOk(n, comb)) return false;
              aplicar(n, comb, 1);
              if (dfs(p + 1)) { escolha.set(n.c.id, [...comb]); return true; }
              aplicar(n, comb, -1);
              return false;
            }
            for (let a = start; a < n.cand.length; a++) {
              const i = n.cand[a];
              if (!okDia(n, i)) continue;
              comb.push(i);
              if (pick(a + 1, resta - 1)) return true;
              comb.pop();
              if (nos > LIMITE) return false;
            }
            return false;
          };
          return pick(0, n.k);
        };
        return dfs(0) ? escolha : null;
      };
      // Ordem de leitura das regras quando não cabe tudo: cumpre-se primeiro o que é mais importante e relaxa-se o resto, nesta ordem:
      // look-ahead do domingo seguinte → bloqueio de folga do dia (para não passar dos dias seguidos) → limite de dias seguidos (até 6) → mínimo de menor prioridade → mínimo de maior prioridade → dias seguidos → teto de folgas por dia.
      // As 2 folgas semanais nunca são sacrificadas.
      const lim6 = Math.max(maxDiasCfg, 6);
      const fnPrimeiro = R.prioridadeMinimo !== "geral";
      const niveis = [
        { minGeral: true, minFn: true, lim: maxDiasCfg, look: true },
        { minGeral: true, minFn: true, lim: maxDiasCfg, look: false },
        { minGeral: true, minFn: true, lim: maxDiasCfg, look: false, liberaBloqueio: true },
        { minGeral: true, minFn: true, lim: lim6, look: false },
        { minGeral: !fnPrimeiro, minFn: fnPrimeiro, lim: lim6, look: false },
        { minGeral: false, minFn: false, lim: lim6, look: false },
        { minGeral: false, minFn: false, lim: 99, look: false },
        { minGeral: false, minFn: false, lim: 99, look: false, semTeto: true }
      ];
      let sol = null, nivelUsado = -1;
      // Folga a mais do aniversário: só entra se couber sem relaxar nenhuma regra; senão a semana segue sem ela (e o app avisa).
      for (let ni = 0; ni < niveis.length; ni++) {
        if (extraNeeds.length) { sol = tentar(niveis[ni], [...extraNeeds, ...needs]); if (sol) { nivelUsado = ni; break; } }
        sol = tentar(niveis[ni]); if (sol) { nivelUsado = ni; break; }
      }
      meta.diag.push({ semana: sem[0].iso, nivel: nivelUsado, alvo: sem.some(d => d.dentro) });
      if (sol) {
        const extraIds = new Set(extraNeeds.map(n => n.c.id));
        sol.forEach((dias7, cid) => dias7.forEach(i => {
          G[cid][sem[i].iso] = extraIds.has(cid) ? { st: "FOLGA", aniv: "extra" } : { st: "FOLGA" };
          if (!permiteDia[i] && sem[i].dentro) meta.folgaEmDiaBloqueado.push({ col: nomeCurto(colById(cid)), iso: sem[i].iso });
        }));
      } else {
        // Último recurso: distribuição gulosa (sem garantia de dias seguidos)
        const podeDarFolgaNoDia = (c, d, respeitarMinimos) => {
          if (!livre(c, d) || duty[c.id]?.[d.iso] || !diaPermiteFolga(d)) return false;
          if (folgasNoDia(d) >= maxFolgasPermitidasNoDia(d, nEqDia(d))) return false;
          if (!respeitarMinimos) return true;
          if (ativosNoDia(d) - 1 < minimoDiaEsperado(d)) return false;
          const fn = funcaoDoCol(c), reqFn = minimoFuncaoNoDia(fn, d);
          if (fn && reqFn > 0 && equipe.filter(x => funcaoDoCol(x)?.id === fn.id && !G[x.id][d.iso]).length - 1 < reqFn) return false;
          return true;
        };
        needs.forEach(n => {
          let precisa = n.k;
          while (precisa > 0) {
            let cands = sem.filter(d => podeDarFolgaNoDia(n.c, d, true));
            if (!cands.length) cands = sem.filter(d => podeDarFolgaNoDia(n.c, d, false));
            if (!cands.length) break;
            cands.sort((a, b) => folgasNoDia(a) - folgasNoDia(b) || rankDia(n.j, sem.indexOf(a)) - rankDia(n.j, sem.indexOf(b)));
            G[n.c.id][cands[0].iso] = { st: "FOLGA" };
            precisa--;
          }
        });
      }
      // folgas que ficaram pendentes
      needs.forEach(n => {
        const tem = sem.filter(d => { const s = G[n.c.id][d.iso]?.st; return s === "FECHADO" || (s === "FOLGA" && (d.dow !== 0 || R.domingoContaFolgaSemana)) || (s === "FER_FOLGA" && R.priorizarFeriadoFolga); }).length;
        const disp = sem.filter(d => !["FERIAS", "AFAST", "FORA"].includes(G[n.c.id][d.iso]?.st)).length;
        const alvo = Math.round((Number(R.folgasSemana) || 2) * disp / 7);
        if (tem < alvo && sem.some(d => d.dentro)) meta.folgaBloqueadaSemDia.push({ col: nomeCurto(n.c), ini: sem[0].iso, fim: sem[6].iso, faltam: alvo - tem });
      });
    }

    // 2d') Aniversário: folga a mais (semana com feriado já usado como folga) e conferência de quem não conseguiu a folga
    anivExtra.forEach(({ c, d }) => {
      if (!livre(c, d) || duty[c.id]?.[d.iso] || !diaPermiteFolga(d)) return;
      if (folgasNoDia(d) >= maxFolgasPermitidasNoDia(d, nEqDia(d))) return;
      if (ativosNoDia(d) - 1 < minimoDiaEsperado(d)) return;
      const fn = funcaoDoCol(c), reqFn = minimoFuncaoNoDia(fn, d);
      if (fn && reqFn > 0 && equipe.filter(x => funcaoDoCol(x)?.id === fn.id && !G[x.id][d.iso]).length - 1 < reqFn) return;
      G[c.id][d.iso] = { st: "FOLGA", aniv: "extra" };
    });
    Object.entries(anivSem).forEach(([cid, d]) => {
      const cel = G[cid][d.iso];
      if (cel && cel.st === "FOLGA" && !cel.aniv) cel.aniv = true;
      if (!cel && d.dentro) meta.anivSemFolga.push({ col: nomeCurto(colById(cid)), iso: d.iso });
    });

    // 2e) Auditoria de mínimos por função e mínimo geral do dia
    sem.filter(d => d.aberto).forEach(d => {
      const trabDia = equipe.filter(c => trabOuLivre(c, d)).length;
      const reqDia = minimoDiaEsperado(d);
      if (trabDia < reqDia && d.dentro) meta.deficitDia.push({ iso: d.iso, exigido: reqDia, faltam: reqDia - trabDia });
      E.funcoes.forEach(fn => {
        const reqFn = minimoFuncaoNoDia(fn, d);
        if (reqFn <= 0) return;
        const trabFn = equipe.filter(c => funcaoDoCol(c)?.id === fn.id && trabOuLivre(c, d)).length;
        if (trabFn < reqFn && d.dentro) meta.deficitFuncao.push({ iso: d.iso, funcao: fn.nome, exigido: reqFn, faltam: reqFn - trabFn });
      });
    });

    // 3) Horas de cada dia: padrão da jornada (ex.: 36h = 4×8h + 1×4h). Dias a menos (férias, compensação) não viram dias mais longos.
    const planoHoras = {};
    const curtosNoDia = {};   // quantos dias curtos (ex.: 4h) já caíram em cada dia, pra não juntar todo mundo no mesmo dia
    equipe.forEach(c => {
      const diasTrab = sem.filter(d => !G[c.id][d.iso]);
      // Dias já trabalhados em mês fechado contam na semana: as horas deles saem da sequência antes de distribuir o resto.
      const fechTrab = sem.filter(d => G[c.id][d.iso]?.travado && ehTrab(G[c.id][d.iso]));
      const nDias = diasTrab.length + fechTrab.length;
      const padrao = planoHorasSemanaCol(c, Math.max(1, 7 - (Number(R.folgasSemana) || 2)), R);
      let horasSeq = nDias >= padrao.length ? planoHorasSemanaCol(c, nDias, R) : [...padrao].sort((a, b) => b - a).slice(0, nDias);
      if (fechTrab.length) {
        horasSeq = [...horasSeq];
        fechTrab.forEach(d => { const h = Number(G[c.id][d.iso].horas) || 0; let k = horasSeq.findIndex(x => Math.abs(x - h) < 0.01); if (k < 0) k = horasSeq.reduce((bi, x, i) => Math.abs(x - h) < Math.abs(horasSeq[bi] - h) ? i : bi, 0); if (horasSeq.length) horasSeq.splice(k, 1); });
      }
      // Dias mais longos nos dias com menos gente; o dia curto vai pro dia com mais gente, descontando os curtos que já caíram nele
      // (cada dia curto vale meia pessoa), pra espalhar os dias curtos da equipe pela semana.
      const peso = d => ativosNoDia(d) - (curtosNoDia[d.iso] || 0) * 0.5;
      const ordenados = [...diasTrab].map((d, k) => [d, k]).sort((a, b) => peso(a[0]) - peso(b[0]) || a[1] - b[1]).map(x => x[0]);
      planoHoras[c.id] = {};
      const maxH = Math.max(0, ...horasSeq);
      ordenados.forEach((d, idx) => { const h = horasSeq[idx] ?? horasDiaCol(c, R); planoHoras[c.id][d.iso] = h; if (h < maxH - 0.01) curtosNoDia[d.iso] = (curtosNoDia[d.iso] || 0) + 1; });
    });

    // 4) Turnos
    const catAtivo = !!(E.turnos && E.turnos.ativo && (E.turnos.lista || []).length);
    sem.forEach((d, dIdx) => {
      const diaGlobalIdx = w * 7 + dIdx;
      const trabalhandoHoje = equipe.filter(c => !G[c.id][d.iso]);
      if (!trabalhandoHoje.length) return;
      const stDia = c => duty[c.id]?.[d.iso] || statusTrabalhoDia(d);
      const hoursOf = c => Number(planoHoras[c.id]?.[d.iso] ?? horasDiaCol(c, R));

      if (catAtivo) {
        const domFer = d.dow === 0 || (d.fer && d.aberto && d.fer.tratamento !== "FOLGA");
        const tipo = domFer ? "domingo" : d.dow === 6 ? "sabado" : "util";
        const cfg = d.cfg || {};
        // Quem é de uma função com turnos próprios no catálogo recebe esses turnos (em rodízio) e sai do cálculo geral da loja.
        const descMinCat = (Number(R.descanso) || 0) * 60;
        const diaAntCat = todos[diaGlobalIdx - 1];
        trabalhandoHoje.forEach((c, ci) => {
          const fn = funcaoDoCol(c); if (!fn) return;
          const proprios = turnosDaFuncao(fn.id, tipo, d.dow).concat(tipo !== "domingo" ? turnosDaFuncao(fn.id, "curto", d.dow) : []);
          const longosProprios = proprios.filter(t => turnoHoras(t) > 4.5);
          const usar = (hoursOf(c) <= 4.5 ? proprios.filter(t => turnoHoras(t) <= 4.5) : longosProprios);
          if (!usar.length && hoursOf(c) <= 4.5 && longosProprios.length) {
            // Dia curto (ex.: 4h): aproveita o começo do turno próprio da função, sem inventar horário de fechamento
            const base = longosProprios[modN(diaGlobalIdx + posDia(c, d), longosProprios.length)];
            const ini0 = turnoBlocos(base)[0][0], fim0 = ini0 + Math.round(hoursOf(c) * 60);
            G[c.id][d.iso] = { st: stDia(c), horas: hoursOf(c), horario: `${fromMin(ini0)}–${fromMin(fim0)}`, ini: ini0, fim: fim0, turno: base.nome + " (curto)" };
            return;
          }
          if (!usar.length) return;
          const celOntem = diaAntCat ? G[c.id][diaAntCat.iso] : null;
          const restoOk = t0 => !(ehTrab(celOntem) && celOntem.fim != null) || (1440 - celOntem.fim) + turnoBlocos(t0)[0][0] >= descMinCat - 0.01;
          const giro = usar[modN(diaGlobalIdx + posDia(c, d), usar.length)];
          const t = restoOk(giro) ? giro : (usar.find(restoOk) || giro);
          const bl = turnoBlocos(t);
          G[c.id][d.iso] = { st: stDia(c), horas: turnoHoras(t), horario: turnoHorarioTxt(t), ini: bl[0][0], fim: bl[bl.length - 1][1], turno: t.nome };
        });
        const listaLongTodos = turnosGerais(tipo, d.dow).filter(t => turnoHoras(t) > 4.5);
        const listaCurta = tipo === "domingo" ? [] : turnosGerais("curto", d.dow);
        const elegCat = trabalhandoHoje.filter(c => !G[c.id][d.iso] && !(funcaoDoCol(c)?.turnos?.length));
        const contagemH = {};
        elegCat.forEach(c => { const h = hoursOf(c); if (h > 4.5) { const k = Math.round(h * 2) / 2; contagemH[k] = (contagemH[k] || 0) + 1; } });
        const modeH = Object.keys(contagemH).sort((a, b) => contagemH[b] - contagemH[a] || b - a)[0];
        const listaLong = modeH ? listaLongTodos.filter(t => Math.abs(turnoHoras(t) - Number(modeH)) < 0.26) : [];
        const longos = elegCat.filter(c => modeH && Math.abs(hoursOf(c) - Number(modeH)) < 0.26 && listaLong.length);
        const curtos = elegCat.filter(c => hoursOf(c) <= 4.5 && listaCurta.some(t => Math.abs(turnoHoras(t) - hoursOf(c)) < 0.26));
        const listaCurtaH = curtos.length ? listaCurta.filter(t => Math.abs(turnoHoras(t) - hoursOf(curtos[0])) < 0.26) : [];

        let comp = null;
        if (longos.length || curtos.length) {
          if (tipo === "domingo") comp = { longos: longos.map((_, i) => listaLong[i % listaLong.length]), curtos: [] };
          else comp = escolherComposicao(cacheComposicao, tipo, cfg, listaLong, listaCurtaH, longos.length, curtos.length);
        }
        if (comp) {
          const ab = toMin(cfg.abertura), fe = toMin(cfg.fechamento);
          const diaAnt = todos[diaGlobalIdx - 1];
          const fimOntem = c => { const cel = diaAnt ? G[c.id][diaAnt.iso] : null; return ehTrab(cel) && cel.fim != null ? cel.fim : null; };
          const descMin = (Number(R.descanso) || 0) * 60;
          const proxDia = todos[diaGlobalIdx + 1];
          // Se amanhã a pessoa tem turno próprio da função (começa cedo), o turno de hoje não pode terminar tarde demais.
          const iniAmanha = c => {
            if (!proxDia || G[c.id][proxDia.iso]) return null;
            const fnA = funcaoDoCol(c); if (!fnA) return null;
            const tipoA = (proxDia.dow === 0 || (proxDia.fer && proxDia.aberto && proxDia.fer.tratamento !== "FOLGA")) ? "domingo" : proxDia.dow === 6 ? "sabado" : "util";
            const op = turnosDaFuncao(fnA.id, tipoA, proxDia.dow).concat(tipoA !== "domingo" ? turnosDaFuncao(fnA.id, "curto", proxDia.dow) : []);
            return op.length ? Math.min(...op.map(x => turnoBlocos(x)[0][0])) : null;
          };
          const descOk = (c, t) => {
            const f = fimOntem(c);
            if (f != null && (1440 - f) + turnoBlocos(t)[0][0] < descMin - 0.01) return false;
            const ia = iniAmanha(c);
            if (ia != null) { const bt = turnoBlocos(t); if ((1440 - bt[bt.length - 1][1]) + ia < descMin - 0.01) return false; }
            return true;
          };
          const turnos = [...comp.longos.map(t => ({ t, curto: false })), ...comp.curtos.map(t => ({ t, curto: true }))].map(o => {
            const bl = turnoBlocos(o.t);
            return { ...o, fecha: fe != null && bl[bl.length - 1][1] >= fe && tipo !== "domingo", abre: ab != null && bl[0][0] <= ab };
          });
          turnos.sort((a, b) => (b.fecha - a.fecha) || (b.abre - a.abre));
          const poolL = [...longos], poolC = [...curtos];
          turnos.forEach(o => {
            const pool = o.curto ? poolC : poolL;
            if (!pool.length) return;
            const regraDom = R.domingoNaoFecha !== false && o.fecha && tipo !== "domingo";
            let cand = pool.filter(c => !(regraDom && domTrab.has(c.id)) && descOk(c, o.t));
            if (!cand.length) cand = pool.filter(c => descOk(c, o.t));
            if (!cand.length) cand = pool;
            cand.sort((a, b) => {
              const ka = o.fecha ? contFecha[a.id] : o.abre ? contAbre[a.id] : 0, kb = o.fecha ? contFecha[b.id] : o.abre ? contAbre[b.id] : 0;
              if (ka !== kb) return ka - kb;
              return modN(posDia(a, d) + diaGlobalIdx, nEqDia(d)) - modN(posDia(b, d) + diaGlobalIdx, nEqDia(d));
            });
            const c = cand[0];
            pool.splice(pool.indexOf(c), 1);
            const bl = turnoBlocos(o.t);
            G[c.id][d.iso] = { st: stDia(c), horas: turnoHoras(o.t), horario: turnoHorarioTxt(o.t), ini: bl[0][0], fim: bl[bl.length - 1][1], turno: o.t.nome };
            if (o.fecha) contFecha[c.id]++;
            if (o.abre) contAbre[c.id]++;
          });
        }
      }

      // Ondas escalonadas para quem não foi coberto pelo catálogo (ou quando não há catálogo)
      const restantes = trabalhandoHoje.filter(c => !G[c.id][d.iso]);
      if (!restantes.length) return;
      const ordenadosOnda = [...restantes].sort((a, b) => {
        const hA = planoHoras[a.id][d.iso] || 8, hB = planoHoras[b.id][d.iso] || 8;
        if (hA !== hB) return hA - hB;
        const idxA = posDia(a, d), idxB = posDia(b, d);
        return R.rodizioHorarios ? modN(idxA + diaGlobalIdx, nEqDia(d)) - modN(idxB + diaGlobalIdx, nEqDia(d)) : idxA - idxB;
      });
      // Descanso entre jornadas (CLT art. 66): cada horário vai pra primeira pessoa da ordem que, com ele, descansa o mínimo
      // desde o fim do dia anterior (ex.: quem fechou às 21h não abre às 7h no dia seguinte).
      const descMinOnda = (Number(R.descanso) || 0) * 60;
      const diaAntOnda = todos[diaGlobalIdx - 1];
      const fimAntOnda = c => { const cel = diaAntOnda ? G[c.id][diaAntOnda.iso] : null; return ehTrab(cel) && cel.fim != null ? cel.fim : null; };
      // Dias curtos sem intervalo (até 4h) ficam fora das ondas: as ondas dos dias inteiros vão da abertura ao fechamento,
      // e os curtos reforçam alternando manhã e fim do dia (antes todos os curtos caíam no fechamento).
      const curtoDia = c => (planoHoras[c.id][d.iso] ?? horasDiaCol(c, R)) <= 4;
      const longosOnda = ordenadosOnda.filter(c => !curtoDia(c)), curtosOnda = ordenadosOnda.filter(curtoDia);
      const poolOnda = [...longosOnda];
      for (let waveIdx = 0; waveIdx < longosOnda.length; waveIdx++) {
        let escolha = null;
        for (const c of poolOnda) {
          const res = montarHorarioOnda(c, d, planoHoras[c.id][d.iso] ?? horasDiaCol(c, R), waveIdx, longosOnda.length);
          const f = fimAntOnda(c);
          if (f == null || res.ini == null || (1440 - f) + res.ini >= descMinOnda - 0.01) { escolha = { c, res }; break; }
        }
        if (!escolha) {
          // Ninguém cabe (ex.: domingo curto que todo mundo começa na abertura): a pessoa entra mais tarde, quando completa o
          // descanso, e o dia fica mais curto (as horas que faltarem aparecem nos avisos).
          const c = poolOnda[0], h0 = planoHoras[c.id][d.iso] ?? horasDiaCol(c, R), f = fimAntOnda(c);
          let res = montarHorarioOnda(c, d, h0, waveIdx, longosOnda.length);
          const minIni = f != null ? f + descMinOnda - 1440 : null, fe = toMin(d.cfg?.fechamento);
          if (minIni != null && res.ini != null && res.ini < minIni && fe != null && fe - minIni >= 60) {
            const dd = { ...d, cfg: { ...d.cfg, abertura: fromMin(minIni) } };
            res = montarHorarioOnda(c, dd, Math.min(h0, (fe - minIni) / 60), waveIdx, longosOnda.length);
          }
          escolha = { c, res };
        }
        poolOnda.splice(poolOnda.indexOf(escolha.c), 1);
        G[escolha.c.id][d.iso] = { st: stDia(escolha.c), ...escolha.res };
      }
      if (curtosOnda.length) {
        const abD = toMin(d.cfg?.abertura), feD = toMin(d.cfg?.fechamento);
        const temLongos = longosOnda.length > 0, passo = passoHorario();
        // Curto nº k: pares de manhã (depois de quem abre), ímpares no fim do dia; a cada par, 1h mais pra dentro do dia.
        const curtoNoSlot = (c, k) => {
          const h = planoHoras[c.id][d.iso] ?? horasDiaCol(c, R), tm = Math.round(h * 60);
          if (abD == null || feD == null || feD - abD < tm) return montarHorarioOnda(c, d, h, 0, 1);
          const desloc = Math.floor(k / 2) * 60;
          const ini = k % 2 === 0
            ? Math.min(feD - tm, abD + (temLongos && feD - abD >= 600 ? 60 : 0) + desloc)
            : Math.max(abD, feD - tm - desloc);
          const iniR = Math.max(abD, Math.min(feD - tm, Math.round(ini / passo) * passo));
          return montarHorarioOnda(c, { ...d, cfg: { ...d.cfg, abertura: fromMin(iniR), fechamento: fromMin(iniR + tm) } }, h, 0, 1);
        };
        const descOk = (c, res) => { const f = fimAntOnda(c); return f == null || res.ini == null || (1440 - f) + res.ini >= descMinOnda - 0.01; };
        const poolC = [...curtosOnda];
        for (let k = 0; k < curtosOnda.length; k++) {
          let escolha = null;
          for (const kk of [k, k + 1]) {
            for (const c of poolC) { const res = curtoNoSlot(c, kk); if (descOk(c, res)) { escolha = { c, res }; break; } }
            if (escolha) break;
          }
          if (!escolha) escolha = { c: poolC[0], res: curtoNoSlot(poolC[0], 1) };
          poolC.splice(poolC.indexOf(escolha.c), 1);
          G[escolha.c.id][d.iso] = { st: stDia(escolha.c), ...escolha.res };
        }
      }
    });
  }

  // 4b) Restrições de horário (saída antes / entrada depois): o turno é recortado e a diferença segue o tratamento escolhido.
  const txtBlocosR = bl => (bl.length === 2 && R.exibirTurnosPartidos) ? `${fromMin(bl[0][0])}–${fromMin(bl[0][1])} / ${fromMin(bl[1][0])}–${fromMin(bl[1][1])}` : `${fromMin(bl[0][0])}–${fromMin(bl[bl.length - 1][1])}`;
  equipe.forEach(c => {
    if (!Array.isArray(c.restricoes) || !c.restricoes.length) return;
    todos.forEach(d => {
      const cel = G[c.id][d.iso];
      if (!ehTrab(cel)) return;
      const rs = restricoesAtivas(c, d).filter(r => r.tipo === "SAIDA" || r.tipo === "ENTRADA");
      if (!rs.length) return;
      const bl0 = blocosDaCel(cel); if (!bl0) return;
      let hi = 1440, lo = 0, trat = null;
      rs.forEach(r => { const h = toMin(r.hora); if (h == null) return; if (r.tipo === "SAIDA") hi = Math.min(hi, h); else lo = Math.max(lo, h); trat = tratRest(r); });
      if (!trat) return;
      const bl = bl0.map(([a, b]) => [Math.max(a, lo), Math.min(b, hi)]).filter(([a, b]) => b > a);
      const soma = arr => arr.reduce((x, [a, b]) => x + (b - a), 0);
      const antes = soma(bl0), depois = soma(bl);
      if (depois === antes) { cel.lim = { lo, hi }; return; }
      if (!bl.length) { G[c.id][d.iso] = { st: "REST", trat, perdaMin: antes, motivo: rs[0].motivo || "" }; return; }
      cel.horario = txtBlocosR(bl); cel.ini = bl[0][0]; cel.fim = bl[bl.length - 1][1];
      cel.horas = Math.round(depois / 60 * 100) / 100; cel.perdaMin = antes - depois; cel.trat = trat; cel.lim = { lo, hi }; cel.motivo = rs[0].motivo || "";
    });
  });

  // 5) Rede de segurança: nunca mais de 6 dias seguidos (o 7º dia é repouso), contando entre semanas
  equipe.forEach(c => {
    let seq = 0;
    todos.forEach(d => {
      const cel = G[c.id][d.iso];
      if (ehTrab(cel)) {
        seq++;
        if (seq > Math.max(6, maxDiasCfg) && cel.st === "TRAB" && diaPermiteFolga(d)) { G[c.id][d.iso] = { st: "FOLGA", extra: true }; seq = 0; }
      } else seq = 0;
    });
  });

  // 5b) Completa a carga semanal: se um dia ficou curto (ex.: domingo com poucas horas de funcionamento), os outros dias
  // da semana são estendidos aos poucos, respeitando o limite de horas por dia, a janela de funcionamento e o descanso entre jornadas.
  if (R.completarCargaSemana || equipe.some(c => Array.isArray(c.restricoes) && c.restricoes.length)) {
    const diasTrabPadrao = Math.max(1, 7 - (Number(R.folgasSemana) || 2));
    const descMinTot = (Number(R.descanso) || 0) * 60;
    const txtBlocos = bl => (bl.length === 2 && R.exibirTurnosPartidos) ? `${fromMin(bl[0][0])}–${fromMin(bl[0][1])} / ${fromMin(bl[1][0])}–${fromMin(bl[1][1])}` : `${fromMin(bl[0][0])}–${fromMin(bl[bl.length - 1][1])}`;
    equipe.forEach(c => {
      const fn = funcaoDoCol(c);
      const maxH = Number(fn?.maxHorasDia) || Number(R.maxHorasDia) || 10;
      const livreJanela = !!fn?.permiteForaHorario;
      for (let w = 0; w < todos.length / 7; w++) {
        const sem = todos.slice(w * 7, w * 7 + 7);
        const cels = sem.map(d => G[c.id][d.iso]);
        if (cels.some(x => !x)) continue;
        const trab = cels.filter(ehTrab);
        const nRest = cels.filter(x => x.st === "REST").length;
        if (trab.length !== diasTrabPadrao - nRest || cels.some(x => !ehTrab(x) && x.st !== "FOLGA" && x.st !== "FECHADO" && x.st !== "REST")) continue;
        const temPerda = cels.some(x => x.perdaMin);
        const perdaComp = cels.reduce((s, x) => s + (x.trat === "compensar" ? (x.perdaMin || 0) : 0), 0);
        let falta = Math.round((Number(c.carga) - trab.reduce((s, x) => s + (Number(x.horas) || 0), 0)) * 60);
        if (temPerda) falta = Math.min(falta, perdaComp); else if (!R.completarCargaSemana) continue;
        if (falta < 15) continue;
        let progresso = true;
        while (falta >= 15 && progresso) {
          progresso = false;
          sem.forEach((d, k) => {
            const cel = cels[k];
            if (falta < 15 || !ehTrab(cel) || cel.turno || cel.manual) return;
            const bl = blocosDaCel(cel); if (!bl) return;
            const ab = toMin(d.cfg?.abertura), fe = toMin(d.cfg?.fechamento);
            const prev = todos[w * 7 + k - 1] ? G[c.id][todos[w * 7 + k - 1].iso] : null, prox = todos[w * 7 + k + 1] ? G[c.id][todos[w * 7 + k + 1].iso] : null;
            const ini0 = bl[0][0], fim0 = bl[bl.length - 1][1];
            let depois = livreJanela || fe == null ? 24 * 60 : Math.max(0, fe - fim0);
            if (ehTrab(prox) && prox.ini != null) depois = Math.min(depois, Math.max(0, prox.ini + 1440 - descMinTot - fim0));
            let antes = livreJanela || ab == null ? 0 : Math.max(0, ini0 - ab);
            if (ehTrab(prev) && prev.fim != null) antes = Math.min(antes, Math.max(0, ini0 - (descMinTot - 1440 + prev.fim)));
            if (cel.lim) { depois = Math.min(depois, Math.max(0, cel.lim.hi - fim0)); antes = Math.min(antes, Math.max(0, ini0 - cel.lim.lo)); }
            // Intervalo (CLT art. 71): sem pausa o dia vai até 4h; com pausa de 15 min, até 6h; acima disso precisa de 1h.
            const pausaAtual = bl.length > 1 ? bl[1][0] - bl[0][1] : 0;
            const tetoDia = pausaAtual >= 60 ? maxH : pausaAtual >= 15 ? Math.min(maxH, 6) : Math.min(maxH, 4);
            const folgaDia = Math.round((tetoDia - (Number(cel.horas) || 0)) * 60);
            const passo = Math.min(30, falta, folgaDia);
            if (passo < 15) return;
            let uso = 0;
            if (depois >= passo) { bl[bl.length - 1][1] += passo; uso = passo; }
            else if (antes >= passo) { bl[0][0] -= passo; uso = passo; }
            if (!uso) return;
            cel.horas = Math.round(((Number(cel.horas) || 0) + uso / 60) * 100) / 100;
            cel.ini = bl[0][0]; cel.fim = bl[bl.length - 1][1]; cel.horario = txtBlocos(bl);
            if (temPerda) { cel.extraComp = (cel.extraComp || 0) + uso; }
            falta -= uso; progresso = true;
          });
        }
      }
    });
  }

  // 6) Invariante: ajustes manuais e trocas pontuais
  Object.entries(E.ajustes || {}).forEach(([cid, mapa]) => {
    if (!G[cid]) return;
    Object.entries(mapa).forEach(([iso, cel]) => { if (G[cid][iso] && G[cid][iso].st !== "FORA") G[cid][iso] = { ...cel, manual: true }; });
  });
  E.trocas.forEach(t => {
    if (!G[t.colA]?.[t.data] || !G[t.colB]?.[t.data] || G[t.colA][t.data].st === "FORA" || G[t.colB][t.data].st === "FORA") return;
    const a = G[t.colA][t.data], b = G[t.colB][t.data];
    G[t.colA][t.data] = { ...b, troca: true };
    G[t.colB][t.data] = { ...a, troca: true };
  });

  // Dias de mês fechado ficam exatamente como foram guardados (por cima de ajustes, trocas e recálculos).
  aplicarFechados();

  const semanas = [];
  for (let w = 0; w < dias.length / 7; w++) semanas.push(dias.slice(w * 7, w * 7 + 7));
  // Relatórios do mês: só quem esteve contratado em algum dia do mês. Escala na tela: também quem entra nas semanas
  // vizinhas que aparecem (ex.: admitido em 01/01 aparece na última semana de dezembro, com os dias de dezembro vazios).
  const equipeMes = equipe.filter(c => diasMes.some(d => G[c.id][d.iso]?.st !== "FORA"));
  const equipeTela = equipe.filter(c => dias.some(d => G[c.id][d.iso]?.st !== "FORA"));
  return { ano, mes, dias, diasMes, semanas, G, equipe: equipeMes, equipeTela, equipeCadeia: equipe, meta, diasCadeia: todos, filaBase: baseFila.map(c => c.id), fechado: !!fech[comp] };
}

function razao() {
  if (!E) return [];
  if (razaoCache) return razaoCache;
  const L = [];
  const meses = [...new Set(E.feriados.filter(f => f.tratamento === "COMP").map(f => f.data.slice(0, 7)))].filter(m => m <= E.competencia && m >= (E.regras.inicioSaldo || "0000-00"));   // créditos só do início do controle até o mês em exibição
  meses.forEach(m => {
    const r = m === E.competencia ? calc : gerarEscala(E, m);
    if (!r) return;
    E.feriados.filter(f => f.tratamento === "COMP" && f.data.startsWith(m)).forEach(f => {
      Object.keys(r.G).forEach(cid => {
        if (r.G[cid][f.data]?.st === "FER_TRAB_COMP") L.push({ colId: cid, data: f.data, qtd: 1, desc: `Trabalhou no feriado: ${f.descricao}`, origem: "Automático" });
      });
    });
  });
  E.compensacoes.forEach(x => L.push({
    id: x.id, colId: x.colId, data: x.data, qtd: x.tipo === "CREDITO" ? 1 : -1, tipo: x.tipo, origem: "Lançamento",
    desc: (x.tipo === "FOLGA" ? "Folga compensatória tirada" : x.tipo === "PAGAMENTO" ? "Compensado em pagamento" : "Crédito lançado") + (x.motivo ? ` — ${x.motivo}` : "")
  }));
  L.sort((a, b) => a.data.localeCompare(b.data));
  razaoCache = L;
  return L;
}
function saldoCol(cid) {
  const L = razao().filter(l => l.colId === cid);
  const ganho = L.filter(l => l.qtd > 0).reduce((s, l) => s + l.qtd, 0), usado = -L.filter(l => l.qtd < 0).reduce((s, l) => s + l.qtd, 0);
  return { ganho, usado, saldo: ganho - usado };
}

function resumoCol(c) {
  const r = { rest: 0, abonoMin: 0, descMin: 0, compMin: 0, extraMin: 0, trab: 0, horas: 0, folgas: 0, ferFolga: 0, comp: 0, ferias: 0, afast: 0, faltas: 0, domingos: 0, ferTrab: 0, ferPago: 0 };
  calc.diasMes.forEach(d => {
    const cel = calc.G[c.id]?.[d.iso]; if (!cel) return;
    const s = cel.st;
    if (ST[s]?.trab) { r.trab++; r.horas += Number(cel.horas) || 0; if (d.dow === 0) r.domingos++; }
    if (s === "FOLGA" || s === "FECHADO") r.folgas++;
    if (s === "FER_FOLGA") r.ferFolga++;
    if (s === "COMP") r.comp++;
    if (s === "FERIAS") r.ferias++;
    if (s === "AFAST") r.afast++;
    if (s === "FALTA") r.faltas++;
    if (s === "REST") r.rest++;
    { const pm = cel.perdaMin || 0; if (pm) { if (cel.trat === "descontar") r.descMin += pm; else if (cel.trat === "compensar") r.compMin += pm; else r.abonoMin += pm; } r.extraMin += cel.extraComp || 0; }
    if (s === "FER_TRAB_COMP") r.ferTrab++;
    if (s === "FER_TRAB_PAGO") r.ferPago++;
  });
  r.horas = Math.round(r.horas * 10) / 10;
  r.compMin = Math.max(0, r.compMin - r.extraMin);
  return r;
}

/* Confere se a configuração é possível antes de gerar a escala (mínimos x equipe x folgas). Não depende do mês. */
function diagnosticoConfig() {
  const D = [];
  if (!E) return D;
  const R = E.regras, ativos = E.equipe.filter(c => c.status === "Ativo");
  const nAt = ativos.length;
  const add = (t, x) => D.push({ t, x });
  if (!nAt) { add("err", "Nenhum colaborador ativo cadastrado."); return D; }
  const abertos = DIAS_CFG.filter(d => d.id !== "feriado" && E.horarios[d.id]?.aberto);
  if (!abertos.length) add("err", "Todos os dias estão marcados como fechados.");
  const folgas = Number(R.folgasSemana) || 2;
  let presencas = 0;
  const semHorario = [];
  abertos.forEach(dc => {
    const h = E.horarios[dc.id], min = Number(h.minimoFuncionarios) || 0;
    const aptos = dc.dow === 0 ? ativos.filter(c => c.domingo).length : nAt;
    if (min > aptos) add("err", `${dc.label}: mínimo de ${min} pessoa(s), mas só ${aptos} podem trabalhar nesse dia.`);
    presencas += Math.min(min, aptos);

  });
  if (semHorario.length) add("warn", `${semHorario.length > 1 ? semHorario.slice(0, -1).join(", ") + " e " + semHorario.at(-1) + ": marcados" : semHorario[0] + ": marcado"} como aberto, mas sem horário de abertura e fechamento. Preencha o horário ou marque como fechado em Configurações → Horário da loja.`);

  const semCarga = ativos.filter(c => !(Number(c.carga) > 0)); if (semCarga.length) add("warn", `Sem carga semanal: ${semCarga.map(nomeCurto).join(", ")}. Preencha em Cadastros → Equipe.`);

}

function alertas() {

  const limLegal = limiteLegalSemanal(refISO);
  const proxLimite = LIMITES_JORNADA.find(l => l.desde > refISO);
  equipe.forEach(c => {
    const cg = Number(c.carga);
    if (cg > limLegal) add("err", `${nomeCurto(c)}: ${cg}h por semana passa o limite da lei, que é ${limLegal}h em ${br(refISO)}.`);
    else if (proxLimite && cg > proxLimite.horas) add("warn", `${nomeCurto(c)}: ${cg}h por semana vai passar do limite da lei, que cai para ${proxLimite.horas}h em ${br(proxLimite.desde)}. Planeje a mudança da carga.`);
    else if (cg > Number(R.jornada)) add("warn", `${nomeCurto(c)}: ${cg}h por semana, acima da jornada padrão da loja (${R.jornada}h).`);

      const sts = sem.map(d => G[c.id]?.[d.iso]?.st);

      return { sem, h: sem.reduce((s, d) => s + (ST[G[c.id][d.iso]?.st]?.trab ? (Number(G[c.id][d.iso].horas) || 0) : 0), 0) };
    }).filter(Boolean);
    const diasPadrao = Math.max(1, 7 - (Number(R.folgasSemana) || 2));
    const curta = semHoras.find(x => x.sem.filter(d => ST[G[c.id][d.iso]?.st]?.trab).length === diasPadrao && x.sem.every(d => { const s = G[c.id][d.iso]?.st; return ST[s]?.trab || s === "FOLGA" || s === "FECHADO"; }) && x.h < cg - 0.5);
    if (curta) add("info", `${nomeCurto(c)}: ${fmtH(curta.h)} na semana de ${brC(curta.sem[0].iso)} a ${brC(curta.sem[6].iso)}, abaixo das ${cg}h (algum dia tem a loja aberta por pouco tempo). ${R.completarCargaSemana ? "O horário da loja não deixa fechar essas horas na semana: dá pra combinar banco de horas, ajustar a carga dela ou mudar o horário/intervalo da loja." : "Pra fechar as horas, ligue \"Completar as horas da semana\" em Regras → Jornada."}`);
    const estoura = semHoras.find(x => x.h > cg + 0.01);
    if (estoura) add("warn", `${nomeCurto(c)}: ${fmtH(estoura.h)} na semana de ${brC(estoura.sem[0].iso)} a ${brC(estoura.sem[6].iso)}, acima da carga de ${cg}h.`);
    const maxDia = Math.max(0, ...diasMes.map(d => { const cel = G[c.id]?.[d.iso]; return ST[cel?.st]?.trab ? (Number(cel.horas) || 0) : 0; }));
    const fnC = funcaoDoCol(c), limFn = fnC && fnC.maxHorasDia ? Number(fnC.maxHorasDia) : null;
    if (limFn) { if (maxDia > limFn + 0.01) add("warn", `${nomeCurto(c)}: jornadas de até ${fmtH(maxDia)} por dia, acima do limite de ${fmtH(limFn)} definido para a função ${fnC.nome}.`); }
    else if (maxDia > 8.01) add("warn", `${nomeCurto(c)}: dias de até ${fmtH(maxDia)}. Mais de 8h por dia precisa de acordo ou convenção coletiva; confirme com o contador ou o sindicato.`);
  });

  // Ano sem nenhum feriado cadastrado: a escala sai sem feriado nenhum.
  { const anoM = diasMes[0].iso.slice(0, 4); if (E.feriados.length && !E.feriados.some(f => f.data.startsWith(anoM + "-"))) add("warn", `Nenhum feriado cadastrado em ${anoM}: a escala desse ano está saindo sem feriados. Em Cadastros → Feriados, use "Replicar" para copiar os do ano anterior.`); }
  // Lei 10.101 (art. 6º): no comércio, o descanso tem que cair no domingo pelo menos 1 vez a cada 3 semanas.

    equipe.forEach(c => {
      let seq = 0;
      for (const d of doms) {
        const cel = G[c.id]?.[d.iso];
        seq = ST[cel?.st]?.trab ? seq + 1 : 0;
        if (seq >= 3 && d.iso >= iniM) { add("warn", `${nomeCurto(c)}: ${seq} domingos seguidos trabalhando (até ${br(d.iso)}). No comércio, a lei pede folga em pelo menos 1 domingo a cada 3 semanas: troque um desses domingos.`); break; }

  equipe.forEach(c => {

    let ab = 0, de = 0, co = 0, ex = 0, nr = 0;
    diasMes.forEach(d => { const cel = G[c.id]?.[d.iso]; if (!cel) return; if (cel.st === "REST") nr++; const pm = cel.perdaMin || 0; if (pm) { if (cel.trat === "descontar") de += pm; else if (cel.trat === "compensar") co += pm; else ab += pm; } ex += cel.extraComp || 0; });
    co = Math.max(0, co - ex);
    const partes = [];

    if (ab) partes.push(`${fmtH(ab / 60)} abonadas`);
    if (de) partes.push(`${fmtH(de / 60)} a descontar na folha`);
    if (co) partes.push(`${fmtH(co / 60)} ainda a compensar`);
    if (partes.length) add("info", `${nomeCurto(c)} (restrições): ${partes.join(" · ")}.`);
  });

  const almocoLongo = {};
  DIAS_CFG.forEach(dc => {

    const ls = toMin(h.almocoSaida), lr = toMin(h.almocoRetorno);

      const f = sts.filter(s => s === "FOLGA" || s === "FECHADO" || (s === "FER_FOLGA" && R.priorizarFeriadoFolga)).length;
      if (f < R.folgasSemana) add("err", `${nomeCurto(c)}: semana de ${brC(sem[0].iso)} a ${brC(sem[6].iso)} com ${f} folga(s); o mínimo é ${R.folgasSemana}.`);

      else seq = 0;
    });
    for (let i = 1; i < dias.length; i++) {

      <button class="nav-btn ${view === "empresas_master" ? "active" : ""}" onclick="ir('empresas_master')" title="Empresas e Acessos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.master}</svg>
        <span>Empresas e Acessos</span>
      </button>
    </div>`;
  }

  if (temEmpresa) {
    const grupos = [
      ["Operação", [["painel", "Painel e escala"]]],
      ["Lançamentos", [["ocorrencias", "Férias e ausências"], ["compensacoes", "Compensações"]]],
      ["Relatórios", [["aviso", "Aviso semanal"], ["espelho", "Espelho mensal"], ["resumo", "Horas e folgas"], ["whatsapp", "Mensagens WhatsApp"]]]
    ];
    htmlNav += grupos.map(([g, itens]) => `<div class="nav-group"><div class="nav-label">${g}</div>${itens.map(([id, nome]) =>
      `<button class="nav-btn ${view === id ? "active" : ""}" onclick="ir('${jsa(id)}')" title="${nome}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[id]}</svg><span>${nome}</span>${id === "painel" && nErr ? `<em class="count">${nErr}</em>` : ""}</button>`).join("")}</div>`).join("");

    htmlNav += `<div class="nav-group"><div class="nav-label">Cadastros e configurações</div>
      <button class="nav-btn ${view === "cadastros" ? "active" : ""}" onclick="ir('cadastros')" title="Equipe, funções, feriados e empresa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.equipe}</svg><span>Cadastros</span></button>
      <button class="nav-btn ${view === "config" ? "active" : ""}" onclick="ir('config')" title="Configurações da empresa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON.config}</svg><span>Configurações</span>${configErros() ? `<em class="count">${configErros()}</em>` : ""}</button>
    </div>`;
  }

  if ($("nav")) $("nav").innerHTML = htmlNav;
  const n = permitidas.length;
  if ($("planInfo")) $("planInfo").textContent = isMaster() ? `Master · ${n} empresa${n === 1 ? "" : "s"} · v${SCHEMA_VERSION}` : `Cliente · ${n} empresa${n === 1 ? "" : "s"} liberada${n === 1 ? "" : "s"}`;
}

function renderTopo() {
  if (!$("pgTitulo")) return;
  const ml = $("mesLabel");   // só existe no layout quando há empresa selecionada
  if (ml) { if (E) { const [y, m] = E.competencia.split("-").map(Number); ml.textContent = `${MESES[m - 1]} ${y}`; } else ml.textContent = "Sem empresa"; }
  const tt = TITULOS[view] || ["", ""];
  $("pgTitulo").textContent = tt[0];
  $("pgSub").textContent = `${nomeEmp()} · ${tt[1]}`;
}

function toggleSide() {
  if (window.matchMedia("(max-width: 900px)").matches) document.body.classList.toggle("side-open");
  else { document.body.classList.toggle("side-mini"); S.ui.mini = document.body.classList.contains("side-mini"); salvar(); }
}

function ir(v) {
  if (!E && v !== "empresas_master") { toast("Crie ou selecione uma empresa antes de acessar esta tela."); return; }
  if (TELA_PARA_ABA[v]) v = abrirAba(TELA_PARA_ABA[v]);
  view = v; S.ui.view = v;
  document.body.classList.remove("side-open");
  salvar(); render(); window.scrollTo({ top: 0 });
}

function mudarMes(delta) {
  if (!E) return;
  const [y, m] = E.competencia.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  E.competencia = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  // Mantém o jeito de ver: mês inteiro continua mês inteiro; por semana, avança para a semana seguinte (ou volta para a anterior).
  if (ui.filtro !== "todas") ui.filtroIr = { dir: delta > 0 ? 1 : -1, ref: ui.semanaVistaISO || null };
  ui.semanaIr = { dir: delta > 0 ? 1 : -1, ref: ui.semanaAvisoISO || null };
  salvar(); render();
}

function renderAppShell() {
  const usr = usuarioAtual();
  const permitidas = empresasPermitidas(usr);
  const temEmpresa = !!E;
  $("root").innerHTML = `${seloEskla()}
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-scroll">
        <div class="brand">
          <div class="logo" id="sideLogo">EL</div>
          <div class="brand-txt"><div class="brand-name" id="sideNome">Sua empresa</div><div class="brand-sub"><b style="color:#CBD5E1">Eskla Formiga</b> · escala pronta, dentro da lei</div></div>
        </div>
        ${(isMaster() || permitidas.length > 0) ? `
        <div class="emp-switch">
          <select id="empSelect" onchange="trocarEmpresa(this.value)" title="Trocar empresa ativa"></select>
          ${isMaster() ? `<button onclick="criarEmpresa()" title="Cadastrar nova empresa">+</button>` : ""}
        </div>` : ""}
        <nav id="nav"></nav>
      </div>
      <div class="side-foot">
        <div class="user-pill"><div><b>${esc(usr.nome)}</b><small>${isMaster() ? "Usuário Master" : "Acesso Cliente"}</small></div><button onclick="sairSessao()">Sair</button></div>
        <div class="rule-chip"><strong>Nova lei da jornada (EC 141/2026)</strong>Fim da 6x1: 2 folgas por semana. Limite de 42h a partir de 16/12/2026 e 40h a partir de 16/12/2027.</div>
        <div class="plan" id="planInfo">—</div>
      </div>
    </aside>
    <div class="overlay" onclick="toggleSide()"></div>
    <div class="content">
      <header class="topbar">
        <button class="icon-btn" onclick="toggleSide()" title="Abrir/fechar menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <div class="top-title"><h1 id="pgTitulo">Painel</h1><p id="pgSub">—</p></div>
        ${temEmpresa ? `<div class="month-nav"><button onclick="mudarMes(-1)">‹</button><div class="lbl" id="mesLabel">—</div><button onclick="mudarMes(1)">›</button></div>` : ""}
        <div class="save-state" id="saveState">—</div>
      </header>
      <main id="view"></main>
    </div>
  </div>`;
}

const seloEskla = () => `<div class="selo-eskla" aria-hidden="true">${LOGO_ANT}<img src="${LOGO_WORD}" alt=""></div>`;
function renderLogin() {
  aplicarMarca();
  const pend = S.usuarios.find(u => u.role === "master" && u.pendenteSenha);
  const brand = `<div class="login-logo"><div class="marca">${LOGO_ANT}<img src="${LOGO_WORD}" alt="Eskla Formiga"></div><div class="slogan">Escala pronta, dentro da lei</div></div>`;
  const celulas = `<div class="login-cells" aria-hidden="true">${"<i></i>".repeat(7)}</div>`, rodape = `<div class="login-rodape">Escala 5x2 pela CLT, sem planilha.</div>`;
  if (pend) {
    $("root").innerHTML = `
  <div class="login-wrap">
    <div class="login-box">

      <div class="login-hint"><b>Primeiro acesso.</b> Defina a senha do administrador Master. Ela fica salva apenas neste navegador (com hash).</div>
      <div class="field"><label for="lgNova">Nova senha do Master (mín. 6 caracteres)</label><input id="lgNova" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter') $('lgNova2').focus()"></div>
      <div class="field"><label for="lgNova2">Repita a senha</label><input id="lgNova2" type="password" autocomplete="new-password" onkeydown="if(event.key==='Enter') definirSenhaMaster()"></div>
      <button class="btn-primary" style="justify-content:center;padding:10px" onclick="definirSenhaMaster()">Definir senha e entrar</button>
    </div>
    ${celulas}${rodape}
  </div>`;
    setTimeout(() => $("lgNova")?.focus(), 30);
    return;
  }
  $("root").innerHTML = `
  <div class="login-wrap">
    <div class="login-box">
      ${brand}
      <div class="field"><label for="lgUser">Usuário (login)</label><input id="lgUser" autocomplete="username" onkeydown="if(event.key==='Enter') fazerLogin()"></div>
      <div class="field"><label for="lgPass">Senha</label><input id="lgPass" type="password" autocomplete="current-password" placeholder="••••••" onkeydown="if(event.key==='Enter') fazerLogin()"></div>
      <button class="btn-primary" style="justify-content:center;padding:10px" onclick="fazerLogin()">Entrar</button>
      <div class="login-hint">Clientes: use o login e a senha criados pelo administrador. Esqueceu a senha? Peça a quem criou o seu acesso (o responsável da loja ou o administrador).</div>
    </div>
    ${celulas}${rodape}
  </div>`;
  setTimeout(() => $("lgUser")?.focus(), 30);
}

function entrarComo(usr) {
  S.sessao = { userId: usr.id };
  const permitidas = empresasPermitidas(usr);
  if (permitidas.length) { S.ativa = permitidas[0].id; E = S.empresas[S.ativa]; view = "painel"; }
  else { S.ativa = ""; E = null; view = usr.role === "master" ? "empresas_master" : "sem_empresa"; }
  S.ui.view = view; salvarJa(); render();
}

let tentativasLogin = 0, bloqueioLoginAte = 0;
function fazerLogin() {
  if (Date.now() < bloqueioLoginAte) return toast(`Muitas tentativas. Aguarde ${Math.ceil((bloqueioLoginAte - Date.now()) / 1000)}s.`);
  const login = ($("lgUser")?.value || "").trim().toLowerCase();
  const senha = $("lgPass")?.value || "";
  const usr = S.usuarios.find(u => u.login.toLowerCase() === login);
  if (!usr || !conferirSenha(usr, senha)) {
    tentativasLogin++;
    if (tentativasLogin >= 5) { bloqueioLoginAte = Date.now() + 30000; tentativasLogin = 0; }
    return toast("Usuário ou senha inválidos.");
  }
  tentativasLogin = 0;
  entrarComo(usr);
}

function definirSenhaMaster() {
  const a = $("lgNova")?.value || "", b = $("lgNova2")?.value || "";
  const erro = validarNovaSenha(a, b); if (erro) return toast(erro);
  const m = S.usuarios.find(u => u.role === "master" && u.pendenteSenha); if (!m) return;
  definirSenha(m, a);
  entrarComo(m);
  toast("Senha do Master definida.");
}

function alterarSenhaMaster() {
  if (!isMaster()) return;
  const u = usuarioAtual();
  const atual = $("mpAtual")?.value || "", a = $("mpNova")?.value || "", b = $("mpNova2")?.value || "";
  if (!conferirSenha(u, atual)) return toast("Senha atual incorreta.");
  const erro = validarNovaSenha(a, b); if (erro) return toast(erro);
  definirSenha(u, a); salvarJa();
  ["mpAtual", "mpNova", "mpNova2"].forEach(id => { if ($(id)) $(id).value = ""; });
  toast("Senha do Master alterada.");
}

/* ---------------- Acessos (camada de usuários) ----------------
   Todas as mudanças de usuário passam por estas funções. Na versão web (dados na nuvem),
   basta trocar o corpo delas por chamadas ao servidor; as telas continuam iguais.
   Modelo: usuario = { id, nome, login, role: "master" | "cliente", empresaIds: [ids], hash, salt }.
   Vários logins podem apontar para a mesma empresa (ex.: dois gerentes) e mexem nos mesmos dados. */
const podeGerirAcessos = (empId = E?.id) => { const u = usuarioAtual(); return !!(u && empId && (u.role === "master" || (u.empresaIds || []).includes(empId))); };
const usuariosDaEmpresa = (empId = E?.id) => S.usuarios.filter(u => u.role !== "master" && (u.empresaIds || []).includes(empId));
function acessoCriar(empId, nome, login, senha) {
  if (!podeGerirAcessos(empId)) return "Sem permissão para cadastrar acessos nesta empresa.";
  nome = String(nome || "").trim(); login = String(login || "").trim().toLowerCase();
  if (!nome || !login || !senha) return "Preencha nome, login e senha.";
  if (!/^[a-z0-9._-]{3,30}$/.test(login)) return "Login: de 3 a 30 letras, números, ponto, traço ou sublinhado, sem espaço.";
  const erro = validarNovaSenha(senha, null); if (erro) return erro;
  if (S.usuarios.some(u => u.login.toLowerCase() === login)) return "Já existe alguém com esse login. Escolha outro.";
  const novo = { id: uid("usr"), nome, login, role: "cliente", empresaIds: [empId] };
  definirSenha(novo, senha); S.usuarios.push(novo); salvarJa(); return "";
}
function acessoRedefinirSenha(userId, empId, senha) {
  const u = S.usuarios.find(x => x.id === userId);
  if (!u || u.role === "master" || !podeGerirAcessos(empId) || !(u.empresaIds || []).includes(empId)) return "Sem permissão.";
  const erro = validarNovaSenha(senha, null); if (erro) return erro;
  definirSenha(u, senha); salvarJa(); return "";
}
function acessoRemover(userId, empId) {
  const u = S.usuarios.find(x => x.id === userId), eu = usuarioAtual();
  if (!u || u.role === "master" || !podeGerirAcessos(empId)) return "Sem permissão.";
  if (eu && eu.id === u.id) return "Você não pode tirar o seu próprio acesso.";
  u.empresaIds = (u.empresaIds || []).filter(id => id !== empId);
  // Quem ficou sem nenhuma empresa e não foi criado pelo Master some da lista (não tem mais o que acessar).
  if (!u.empresaIds.length && eu?.role !== "master") S.usuarios = S.usuarios.filter(x => x.id !== u.id);
  salvarJa(); return "";
}
function acessoTrocarMinhaSenha(atual, nova, nova2) {
  const u = usuarioAtual(); if (!u) return "Entre de novo.";
  if (!conferirSenha(u, atual)) return "Senha atual incorreta.";
  const erro = validarNovaSenha(nova, nova2); if (erro) return erro;
  definirSenha(u, nova); salvarJa(); return "";
}
function telaCriarAcesso() {
  const erro = acessoCriar(E?.id, $("acNome")?.value, $("acLogin")?.value, $("acSenha")?.value || "");
  if (erro) return toast(erro);
  render(); toast("Acesso criado. Passe o login e a senha pra pessoa.");
}
function telaRedefinirAcesso(userId, el) { const v = el?.value || ""; if (!v) return; const erro = acessoRedefinirSenha(userId, E?.id, v); el.value = ""; toast(erro || "Senha redefinida."); }
function telaRemoverAcesso(userId, ok) {
  const u = S.usuarios.find(x => x.id === userId); if (!u) return;

function capturarFoco() {
  const a = typeof document !== "undefined" ? document.activeElement : null;
  if (!a || a === document.body || !a.tagName || !/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return null;
  const todos = $("view")?.querySelectorAll ? [...$("view").querySelectorAll("input,select,textarea")] : [];
  return { id: a.id || "", idx: todos.indexOf(a), s: a.selectionStart, e: a.selectionEnd, y: window.scrollY };
}
function restaurarFoco(f) {
  if (!f) return;
  let el = f.id ? $(f.id) : null;
  if (!el && f.idx >= 0 && $("view")?.querySelectorAll) el = [...$("view").querySelectorAll("input,select,textarea")][f.idx] || null;
  if (!el || el.disabled) return;
  try { el.focus({ preventScroll: true }); if (f.s != null && el.setSelectionRange && el.type === "text") el.setSelectionRange(f.s, f.e); window.scrollTo(0, f.y); } catch (e) {}
}
function render() {
  const foco = capturarFoco();
  if (TELA_PARA_ABA[view]) { view = abrirAba(TELA_PARA_ABA[view]); S.ui.view = view; }
  aplicarMarca();
  const usr = usuarioAtual();
  if (!usr) { renderLogin(); return; }
  const permitidas = empresasPermitidas(usr);
  if (!E && permitidas.length) { S.ativa = permitidas[0].id; E = S.empresas[S.ativa]; }
  if (E && !permitidas.some(x => x.id === E.id)) { E = permitidas[0] || null; S.ativa = E ? E.id : ""; }
  if (!E && usr.role === "cliente") {
    renderAppShell(); renderSidebar();
    $("pgTitulo").textContent = "Acesso sem empresa vinculada"; $("pgSub").textContent = usr.nome;
    $("view").innerHTML = `<div class="card"><div class="empty">Nenhuma empresa está vinculada ao seu usuário no momento.</div></div>`;
    return;
  }
  if (!E && view !== "empresas_master") view = "empresas_master";
  try { calc = E ? gerarEscala(E) : null; }
  catch (err) {
    console.error(err); calc = null;
    renderAppShell(); renderSidebar();
    if ($("pgTitulo")) $("pgTitulo").textContent = "Erro ao gerar a escala";
    $("view").innerHTML = `<div class="card"><div class="empty"><b>Não foi possível gerar a escala desta empresa.</b><br>${esc(err?.message || err)}<br><br><button class="btn-ghost" onclick="exportarJSON()">Exportar backup desta empresa</button></div></div>`;
    return;
  }
  razaoCache = null;
  renderAppShell(); renderTopo();
  $("view").innerHTML = VIEWS[view]();
  renderSidebar();
  restaurarFoco(foco);
}
