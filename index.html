// Índice da semana a abrir depois de trocar de mês: avançando, a 1ª semana que começa depois da que estava na tela; voltando, a última antes dela.
function semanaAoTrocarMes(sems, ir) {
  if (!sems.length) return 0;
  if (ir.dir > 0) { const i = ir.ref ? sems.findIndex(s => s.dias[0].iso > ir.ref) : 0; return i < 0 ? 0 : i; }
  for (let i = sems.length - 1; i >= 0; i--) if (!ir.ref || sems[i].dias[0].iso < ir.ref) return i;
  return sems.length - 1;
}
function semanasDoMes() { return calc.semanas.filter(s => s.some(d => d.dentro)).map((s, i) => ({ i, dias: s, label: `Semana ${i + 1} · ${brC(s[0].iso)} a ${brC(s[6].iso)}` })); }
// Versão para imprimir a escala: uma tabela por semana, uma embaixo da outra, para caber o mês todo na folha deitada.
function impressaoGrade(vis, eq, G) {
  const blocos = [];
  for (let i = 0; i < vis.length; i += 7) blocos.push(vis.slice(i, i + 7));
  return `<div class="so-print">${blocos.map(sw => {
    const pes = eq.filter(c => sw.some(d => G[c.id]?.[d.iso] && G[c.id][d.iso].st !== "FORA"));
    const head = `<tr><th class="pn">Colaborador</th>${sw.map(d => `<th class="${d.dentro ? "" : "fm"}">${DOW[d.dow]} ${brC(d.iso)}${d.fer ? `<br><small>${esc(d.fer.descricao)}</small>` : ""}</th>`).join("")}<th class="ph">Horas</th></tr>`;
    const linhas = pes.map(c => {
      const hrs = sw.reduce((t, d) => t + (ST[G[c.id][d.iso]?.st]?.trab ? Number(G[c.id][d.iso].horas) || 0 : 0), 0);
      return `<tr><td class="pn">${esc(nomeCurto(c))}</td>${sw.map(d => { const cel = G[c.id][d.iso]; if (!cel || cel.st === "FORA") return `<td class="${d.dentro ? "" : "fm"}"></td>`; return `<td class="${ST[cel.st]?.cls || ""} ${d.dentro ? "" : "fm"}">${esc(ST[cel.st]?.trab ? (cel.horario || "Trabalho") : (ST[cel.st]?.curto || ST[cel.st]?.label || cel.st))}</td>`; }).join("")}<td class="ph">${fmtH(hrs)}</td></tr>`;
    }).join("");
    return `<table class="grade-print"><thead>${head}</thead><tbody>${linhas}</tbody></table>`;
  }).join("")}</div>`;
}
function imprimir(id, orient = "landscape") {
  const el = $(id); if (!el) return;
  $("pageStyle").textContent = `@page { size: A4 ${orient}; margin: 10mm; }`;
  el.classList.add("print-on"); document.body.classList.add("imprimindo");
  // Esconde de verdade (display: none) tudo que não é a folha, para não sobrar página em branco.
  const ancs = []; for (let p = el.parentElement; p && p !== document.documentElement; p = p.parentElement) { p.classList.add("print-anc"); ancs.push(p); }
  const fim = () => { el.classList.remove("print-on"); ancs.forEach(p => p.classList.remove("print-anc")); document.body.classList.remove("imprimindo"); window.removeEventListener("afterprint", fim); };
  window.addEventListener("afterprint", fim); window.print();
}

function criarCliente() {
  const nome = ($("uNome")?.value || "").trim(), login = ($("uLogin")?.value || "").trim().toLowerCase(), senha = $("uSenha")?.value || "", empId = $("uEmp")?.value || "";
  if (!nome || !login || !senha) return toast("Preencha nome, login e senha do cliente.");
  const erro = validarNovaSenha(senha, null); if (erro) return toast(erro);
  if (S.usuarios.some(u => u.login.toLowerCase() === login)) return toast("Já existe um usuário com este login.");
  const novo = { id: uid("usr"), nome, login, role: "cliente", empresaIds: empId ? [empId] : [] };
  definirSenha(novo, senha);
  S.usuarios.push(novo);
  salvarJa(); render(); toast("Usuário cliente criado.");
}
function toggleEmpresaUsuario(userId, empId, ativo) {
  const u = S.usuarios.find(x => x.id === userId); if (!u) return;
  u.empresaIds = u.empresaIds || [];
  if (ativo && !u.empresaIds.includes(empId)) u.empresaIds.push(empId);
  if (!ativo) u.empresaIds = u.empresaIds.filter(id => id !== empId);
  salvarJa(); render();
}
function alterarSenhaCliente(userId, novaSenha, el) {
  const u = S.usuarios.find(x => x.id === userId); if (!u || !novaSenha) return;
  const erro = validarNovaSenha(novaSenha, null); if (erro) { if (el) el.value = ""; return toast(erro); }
  definirSenha(u, novaSenha); salvarJa(); if (el) el.value = ""; toast("Senha redefinida.");
}
function excluirCliente(userId, ok) { if (!ok) return confirmar("Remover este acesso de cliente?", () => excluirCliente(userId, true), "Remover"); S.usuarios = S.usuarios.filter(u => u.id !== userId); salvarJa(); render(); }

VIEWS.painel = () => {

  const A = alertas(), e = E.empresa;
  const passos = [

  const horasTot = equipe.reduce((s, c) => s + resumoCol(c).horas, 0);
  const abertos = diasMes.filter(d => d.aberto);

  const diasFalta = new Set([...(calc.meta?.deficitDia || []), ...(calc.meta?.deficitFuncao || [])].map(x => x.iso));
  const cobertos = abertos.filter(d => equipe.some(c => ST[G[c.id][d.iso]?.st]?.trab) && !diasFalta.has(d.iso)).length;
  const pct = abertos.length ? Math.round(cobertos / abertos.length * 100) : 0;
  const nCrit = A.filter(a => a.t === "err" || a.t === "warn").length;
  const saldoTot = equipe.reduce((s, c) => s + Math.max(0, saldoCol(c.id).saldo), 0);

  const kpis = `<div class="kpis">

function addDraftTurno() { const ini = $("fnIni").value, fim = $("fnFim").value; if (!ini || !fim) return toast("Informe início e fim da janela."); ui.draftTurnos.push({ inicio: ini, fim }); render(); }
function removerDraftTurno(idx) { ui.draftTurnos.splice(idx, 1); render(); }
function salvarFuncao() {
  const nome = $("fnNome").value.trim(); if (!nome) return toast("Informe o nome da função.");
  const setor = $("fnSetor").value.trim() || setorSugerido(nome) || "Geral", minDiaUtil = Math.max(0, Number($("fnMinUtil").value) || 0), minFeriado = Math.max(0, Number($("fnMinFer").value) || 0);
  let turnos = [...ui.draftTurnos]; const ini = $("fnIni")?.value, fim = $("fnFim")?.value;
  if (!turnos.length && ini && fim && ini !== fim) turnos = [{ inicio: ini, fim }];
  upd(e => { e.funcoes.push({ id: uid("fn"), nome, setor, turnos, minDiaUtil, minFeriado, minDomingo: null, permiteForaHorario: false, maxHorasDia: null }); }, true);
  ui.draftTurnos = []; toast("Função cadastrada.");
}
function excluirFuncao(id, ok) {
  const emUso = E.equipe.some(c => funcaoDoCol(c)?.id === id);
  if (emUso && !ok) return confirmar("Esta função está vinculada a colaboradores. Deseja remover mesmo assim?", () => excluirFuncao(id, true), "Remover");
  upd(e => { e.funcoes = e.funcoes.filter(f => f.id !== id); e.equipe.forEach(c => { if (c.funcaoId === id) c.funcaoId = ""; }); }, true);
  toast("Função removida.");
}

VIEWS.feriados = () => {
  const ano = Number(E.competencia.slice(0, 4));

    if (f.tratamento !== "FOLGA") {

  }).join("") || `<tr><td colspan="7" class="empty">Nenhum feriado cadastrado.</td></tr>`;

    <div class="grid g4">
      <div class="field"><label for="fData">Data</label><input type="date" id="fData"></div>
      <div class="field"><label for="fDesc">Nome do feriado</label><input id="fDesc" placeholder="Ex.: Padroeira da cidade"></div>
      <div class="field"><label for="fAbr">Abrangência</label><select id="fAbr">${["Nacional", "Estadual", "Municipal", "Convenção coletiva"].map(x => opt(x, x)).join("")}</select></div>
      <div class="field"><label for="fTrat">Tratamento na escala</label><select id="fTrat">${Object.entries(TRAT_FER).map(([k, v]) => opt(k, v)).join("")}</select></div>
    </div><div class="form-actions"><button class="btn-primary" onclick="addFeriado()">+ Adicionar feriado</button></div></div>
  <div class="card"><div class="card-h"><h2>Feriados cadastrados</h2><span class="badge b-blue">${E.feriados.length}</span></div><div class="tbl-wrap"><table class="stack"><thead><tr><th>Data</th><th>Dia</th><th>Feriado</th><th>Abrangência</th><th>Tratamento</th><th>Impacto na escala</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
};
function addFeriado() {
  const data = $("fData").value; if (!data) return toast("Informe a data do feriado.");
  if (E.feriados.some(f => f.data === data)) return toast("Já existe um feriado nessa data.");
  upd(e => e.feriados.push({ id: uid("fer"), data, descricao: $("fDesc").value.trim() || "Feriado", abrangencia: $("fAbr").value, tratamento: $("fTrat").value }), true);
  toast("Feriado adicionado.");
}
/* Feriados que mudam de data todo ano, calculados a partir da Páscoa. */
const FERIADOS_MOVEIS = [[/paix[aã]o|sexta.feira santa/i, -2], [/corpus christi/i, 60], [/segunda.*carnaval/i, -48], [/carnaval/i, -47], [/cinzas/i, -46], [/p[aá]scoa/i, 0]];
const deslocMovel = desc => { const m = FERIADOS_MOVEIS.find(([re]) => re.test(desc || "")); return m ? m[1] : null; };
function addNacionais(ano) {
  let n = 0, corr = 0;
  upd(e => feriadosNacionais(ano).forEach(([data, descricao]) => {
    if (e.feriados.some(f => f.data === data)) return;
    const mov = deslocMovel(descricao);
    const errado = mov != null ? e.feriados.find(f => f.data.startsWith(`${ano}-`) && deslocMovel(f.descricao) === mov) : null;
    if (errado) { errado.data = data; corr++; }
    else { e.feriados.push({ id: uid("fer"), data, descricao, abrangencia: "Nacional", tratamento: "FOLGA" }); n++; }
  }), true);
  toast(n || corr ? `Nacionais de ${ano}: ${n} incluído(s), ${corr} data(s) corrigida(s).` : `Os feriados nacionais de ${ano} já estavam certos.`);
}
function replicarFeriados(ano) {
  const origem = E.feriados.filter(f => f.data.startsWith(`${ano}-`));
  if (!origem.length) return toast(`Nenhum feriado cadastrado em ${ano}.`);
  const prox = ano + 1, pascoaProx = pascoa(prox);
  let n = 0, pulados = 0;
  upd(e => origem.forEach(f => {
    const mov = deslocMovel(f.descricao);
    let data;
    if (mov != null) data = isoOf(addDias(pascoaProx, mov));
    else { const md = f.data.slice(5); if (md === "02-29") { pulados++; return; } data = `${prox}-${md}`; }
    if (e.feriados.some(x => x.data === data)) { pulados++; return; }
    e.feriados.push({ id: uid("fer"), data, descricao: f.descricao, abrangencia: f.abrangencia, tratamento: f.tratamento });
    n++;
  }), true);
  toast(`${n} feriado(s) copiado(s) para ${prox}${pulados ? ` (${pulados} já existia(m) ou não se aplica(m))` : ""}. Datas móveis recalculadas pela Páscoa.`);
}

VIEWS.trocas = () => {
  if (E.equipe.filter(c => c.status === "Ativo").length < 2) return vazioEquipe("Cadastre pelo menos duas pessoas ativas para registrar trocas.");
  const linhas = [...E.trocas].sort((a, b) => a.data.localeCompare(b.data)).map(t => {
    const r = t.data.startsWith(E.competencia) ? calc : gerarEscala(E, t.data.slice(0, 7));
    const a = r.G[t.colA]?.[t.data], b = r.G[t.colB]?.[t.data];
    const conf = [];
    if (!a || !b) conf.push("Colaborador inativo ou removido");
    if ([a?.st, b?.st].some(s => s === "FERIAS" || s === "AFAST")) conf.push("Envolve pessoa de férias/afastada");
    const ca = colById(t.colA)?.carga, cb = colById(t.colB)?.carga;

/* ---------------- v25: folga de feriado sugerida ----------------
   Só feriado com tratamento "revezamento + folga compensatória" gera folga a tirar. "Revezamento + pagamento" vira dia
   pago em dobro (lista em Compensações) e não entra aqui. As folgas já tiradas pagam primeiro os créditos mais antigos. */
function creditosPendentes() {
  const porCol = {};
  razao().forEach(l => (porCol[l.colId] = porCol[l.colId] || []).push(l));
  const out = [];
  Object.entries(porCol).forEach(([cid, ls]) => {
    if (!colById(cid)) return;
    let usados = ls.filter(l => l.qtd < 0).length;
    ls.filter(l => l.qtd > 0).sort((a, b) => a.data.localeCompare(b.data)).forEach(l => { if (usados > 0) { usados--; return; } out.push({ colId: cid, data: l.data, desc: l.desc }); });
  });
  return out.sort((a, b) => a.data.localeCompare(b.data) || nomeCol(a.colId).localeCompare(nomeCol(b.colId)));
}
// Procura, para cada folga pendente, os melhores dias nas 4 semanas depois do feriado (não só na semana dele). Ordena pelo que
// é melhor pra loja: mais gente sobrando no dia (contando a função da pessoa), menos gente já de folga, e só então o mais cedo.
// Cada candidato é testado de verdade (a escala é recalculada com a folga): só vale se a semana não ganhar falta de gente nem
// folga sem lugar. A melhor sugestão de cada pessoa entra no teste das seguintes, para duas pessoas não caírem no mesmo dia
// apertado. Nada é gravado: só aceitando.
function sugerirFolgasFeriado(janela = 28, nOpcoes = 3, maxTestes = 12) {
  const pend = creditosPendentes();
  if (!pend.length) return [];
  const hojeISO = isoOf(new Date());
  const orig = E.compensacoes;
  E.compensacoes = [...orig];
  let cache = {};
  const grade = m => cache[m] || (cache[m] = gerarEscala(E, m));
  const problemas = (r, iso) => {
    const sem = r.semanas.find(w => w.some(d => d.iso === iso)) || [];
    const isos = new Set(sem.map(d => d.iso));
    return r.meta.deficitDia.filter(x => isos.has(x.iso)).length + r.meta.deficitFuncao.filter(x => isos.has(x.iso)).length + r.meta.folgaBloqueadaSemDia.filter(x => isos.has(x.ini)).length;
  };
  const out = [];
  try {
    pend.forEach(p => {
      const c = colById(p.colId), fn = funcaoDoCol(c);
      const dFer = parseISO(p.data);
      const ini = isoOf(addDias(dFer, 1)) > hojeISO ? addDias(dFer, 1) : parseISO(hojeISO);
      const cands = [];
      // 4 semanas; se a equipe for apertada e não der 3 opções, olha mais 4.
      for (let k = 0; k < janela * 2 && (k < janela || cands.length < nOpcoes); k++) {
        const iso = isoOf(addDias(ini, k)), m = iso.slice(0, 7);
        if (E.fechamentos?.[m]) continue;
        const r = grade(m), dia = r.diasMes.find(x => x.iso === iso);
        if (!dia || dia.fer || !diaPermiteFolga(dia)) continue;
        const cel = r.G[c.id]?.[iso];
        if (!cel || cel.st !== "TRAB" || cel.manual || cel.travado) continue;
        const trab = r.equipeCadeia.filter(x => ST[r.G[x.id]?.[iso]?.st]?.trab);
        const minD = minimoDiaEsperado(dia), sobra = trab.length - 1 - minD;
        if (sobra < 0) continue;
        const reqFn = minimoFuncaoNoDia(fn, dia), nFn = fn ? trab.filter(x => funcaoDoCol(x)?.id === fn.id).length : 0;
        const sobraFn = fn && reqFn > 0 ? nFn - 1 - reqFn : 99;
        if (sobraFn < 0) continue;
        const folgando = r.equipeCadeia.filter(x => ["FOLGA", "COMP", "FER_FOLGA"].includes(r.G[x.id]?.[iso]?.st)).length;
        const apos = Math.round((parseISO(iso) - dFer) / 864e5);
        cands.push({ iso, m, ficam: trab.length - 1, minD, sobra: Math.min(sobra, sobraFn), sobraGeral: sobra, fnNome: fn && reqFn > 0 ? fn.nome : "", ficamFn: nFn - 1, reqFn, folgando, apos });
      }
      cands.sort((a, b) => b.sobra - a.sobra || b.sobraGeral - a.sobraGeral || a.folgando - b.folgando || a.iso.localeCompare(b.iso));
      const maxSobra = cands.length ? cands[0].sobra : 0;
      const opcoes = [];
      let testes = 0;
      for (const cd of cands) {
        if (opcoes.length >= nOpcoes || testes >= maxTestes) break;
        testes++;
        const antes = problemas(grade(cd.m), cd.iso);
        E.compensacoes.push({ id: "sim", colId: c.id, tipo: "FOLGA", data: cd.iso, motivo: "" });
        cache = {};
        const r2 = grade(cd.m);
        const vale = r2.G[c.id]?.[cd.iso]?.st === "COMP" && problemas(r2, cd.iso) <= antes;
        E.compensacoes.pop(); cache = {};
        if (vale) opcoes.push({ ...cd, melhorSobra: cd.sobra === maxSobra });
      }
      // a melhor opção desta pessoa entra no teste das próximas
      if (opcoes.length) { E.compensacoes.push({ id: "sim", colId: c.id, tipo: "FOLGA", data: opcoes[0].iso, motivo: "" }); cache = {}; }
      out.push({ ...p, opcoes, sugestao: opcoes[0]?.iso || null, analisados: cands.length, maxSobra });
    });
  } finally { E.compensacoes = orig; }
  return out;
}
// Texto da caixinha "Por que esse dia?".
function porQueDia(o, s) {
  const fer = s.desc.replace("Trabalhou no feriado: ", "");
  const partes = [`${o.apos} dia(s) depois de ${esc(fer)}.`, `Com a folga, ficam <b>${o.ficam}</b> pessoa(s) na loja; o mínimo do dia é ${o.minD}.`];
  if (o.fnNome) partes.push(`${esc(o.fnNome)}: ficam ${o.ficamFn}, o mínimo é ${o.reqFn}.`);
  if (o.folgando) partes.push(`Já tem ${o.folgando} pessoa(s) de folga nesse dia.`); else partes.push("Ninguém mais está de folga nesse dia.");
  if (s.maxSobra > 0 && o.melhorSobra) partes.push(`É um dos dias com mais gente sobrando nas semanas depois do feriado (olhei ${s.analisados} dia(s) possíveis).`);
  else if (s.maxSobra === 0) partes.push(`Nas semanas depois do feriado não tem dia com gente sobrando: em todos, com a folga, a loja ou a função da pessoa fica no mínimo. Entre os ${s.analisados} dia(s) possíveis, esse deixa mais gente na loja, tem menos gente de folga e fica mais perto do feriado.`);
  partes.push("Testei a escala com essa folga: a semana não fica com falta de gente e ninguém perde folga.");
  return partes.join(" ");
}

function addComp(ok) {
  const colId = $("cCol").value, tipo = $("cTipo").value, data = $("cData").value;

const mascCNPJ = v => v.replace(/\D/g, "").slice(0, 14).replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
const mascCEP = v => v.replace(/\D/g, "").slice(0, 8).replace(/^(\d{5})(\d)/, "$1-$2");
const mascTel = v => { const n = v.replace(/\D/g, "").slice(0, 11); return n.length > 10 ? n.replace(/^(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3") : n.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3").replace(/^(\d{2})(\d{0,4})$/, "($1) $2"); };
function cnpjValido(v) {
  const n = String(v).replace(/\D/g, "");
  if (n.length !== 14 || /^(\d)\1+$/.test(n)) return false;
  const dig = l => { let s = 0, p = l - 7; for (let i = 0; i < l; i++) { s += Number(n[i]) * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dig(12) === Number(n[12]) && dig(13) === Number(n[13]);
}
function validarCNPJ(el) { const ok = !el.value || cnpjValido(el.value); el.classList.toggle("invalid", !ok); $("cnpjMsg").textContent = ok ? "Dígitos verificadores conferidos." : "CNPJ inválido."; upd(x => x.empresa.cnpj = el.value); }
function carregarLogo(ev) {
  const file = ev.target.files?.[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 256, cv = document.createElement("canvas"), k = Math.min(1, s / Math.max(img.width, img.height));
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      upd(x => x.empresa.logo = cv.toDataURL("image/png"), true); toast("Imagem atualizada.");
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file); ev.target.value = "";
}

/* Quem trabalha nos primeiros domingos/feriados a partir de uma data (prévia na tela de regras). */
function previaRodizio(desdeISO, qtd) {
  if (!E.equipe.some(c => c.status === "Ativo")) return "Cadastre a equipe para ver a prévia.";
  const ini = desdeISO && desdeISO > isoOf(new Date()) ? desdeISO : isoOf(new Date());
  const out = [];
  let mes = ini.slice(0, 7);
  for (let k = 0; k < 4 && out.length < qtd; k++) {
    const r = gerarEscala(E, mes);
    r.diasMes.filter(d => d.iso >= ini && d.aberto && (d.dow === 0 || (d.fer && d.fer.tratamento !== "FOLGA"))).forEach(d => {
      if (out.length >= qtd) return;
      const quem = r.equipe.filter(c => ST[r.G[c.id][d.iso]?.st]?.trab).map(nomeCurto);
      out.push(`<b>${brC(d.iso)}</b>${d.fer ? " (feriado)" : ""}: ${esc(quem.join(", ") || "ninguém")}`);
    });
    const [a, m] = mes.split("-").map(Number); mes = m === 12 ? `${a + 1}-01` : `${a}-${pad(m + 1)}`;
  }
  return out.join(" · ") || "Nenhum domingo ou feriado aberto nos próximos meses.";
}
function getOrdemDomFerAtual() {
  const ativosDom = E.equipe.filter(c => c.status === "Ativo" && c.domingo).map(c => c.id);
  const todosAtivos = E.equipe.filter(c => c.status === "Ativo").map(c => c.id);
  const baseIds = ativosDom.length ? ativosDom : todosAtivos;
  const salvas = Array.isArray(E.regras.ordemRotatividadeDomFer) ? E.regras.ordemRotatividadeDomFer : [];
  const filtradas = salvas.filter(id => baseIds.includes(id));
  baseIds.forEach(id => { if (!filtradas.includes(id)) filtradas.push(id); });
  return filtradas;
}
function sincronizarOrdemDomFer() {
  const ativosDom = E.equipe.filter(c => c.status === "Ativo" && c.domingo).map(c => c.id);
  const todosAtivos = E.equipe.filter(c => c.status === "Ativo").map(c => c.id);
  upd(e => { e.regras.ordemRotatividadeDomFer = ativosDom.length ? ativosDom : todosAtivos; }, true);
  toast("Ordem sincronizada com a equipe ativa.");
}
function moverOrdemDomFer(idx, delta) {
  const arr = getOrdemDomFerAtual(), alvo = idx + delta;
  if (alvo < 0 || alvo >= arr.length) return;
  const tmp = arr[idx]; arr[idx] = arr[alvo]; arr[alvo] = tmp;
  upd(e => { e.regras.ordemRotatividadeDomFer = arr; }, true);
}
function toggleDiaPrefFolga(dow, checked) {
  upd(e => {
    const atual = new Set((e.regras.diasPreferenciaisFolga || []).map(Number));
    if (checked) atual.add(Number(dow)); else atual.delete(Number(dow));
    e.regras.diasPreferenciaisFolga = [...atual];
  }, true);
}

    return ((a.dow - Number(R.inicioSemanaDow ?? 0) + 7) % 7) - ((b.dow - Number(R.inicioSemanaDow ?? 0) + 7) % 7);
  });

  const linhas = diasOrdenados.map(d => {
    const h = E.horarios[d.id], ab = toMin(h.abertura), fe = toMin(h.fechamento);
    const isFer = d.id === "feriado", isDom = d.id === "domingo", dis = !isFer && !h.aberto ? "disabled" : "";
    const horarioInvalido = ab != null && fe != null && fe <= ab && (isFer || h.aberto);
    const tm = (k, l, opcional = false) => `<td data-l="${l}${opcional ? "" : " *"}">${campoHora(`h_${d.id}_${k}`, h[k], `e.horarios.${d.id}.${k}=v`, `${dis} class="hora-input ${horarioInvalido ? "invalid" : ""} ${!opcional && !isFer && h.aberto && !h[k] ? "falta" : ""}" ${opcional ? 'title="Opcional: deixe em branco se a loja não fecha no almoço"' : ""}`)}</td>`;
    const situ = isFer ? `<span class="badge b-blue">Conforme feriado</span>` : `<button class="toggle ${h.aberto ? "on" : "off"}" onclick="upd(e=>e.horarios.${d.id}.aberto=!e.horarios.${d.id}.aberto,true)"><span class="knob"></span>${h.aberto ? "Aberto" : "Fechado"}</button>`;
    const bloqueioHtml = isFer ? `<span class="help">Ignora bloqueio</span>` : `<button class="toggle ${h.bloqueiaFolga ? "warn-t" : "on"}" onclick="upd(e=>e.horarios.${d.id}.bloqueiaFolga=!e.horarios.${d.id}.bloqueiaFolga,true)"><span class="knob"></span>${h.bloqueiaFolga ? "Bloqueada" : "Liberada"}</button>`;
    const maxFolHtml = isFer || isDom ? `<span class="help">${isDom ? "Pelo mín. dom." : "Automático"}</span>` : `<input id="h_${d.id}_maxFolgasDia" type="number" min="0" max="30" value="${h.maxFolgasDia == null ? "" : Number(h.maxFolgasDia)}" placeholder="Auto" title="Vazio = automático (divide as folgas da equipe pelos dias abertos)" ${h.bloqueiaFolga ? "disabled" : ""} style="width:66px" onchange="upd(e=>e.horarios.${d.id}.maxFolgasDia=this.value===''?null:Math.max(0,Number(this.value)||0),true)">`;
    const tot = horarioInvalido ? `<span class="badge b-red" title="Fechamento deve ser maior que abertura">Inválido</span>` : (ab != null && fe != null && fe > ab && (isFer || h.aberto) ? fmtH((fe - ab) / 60) : "—");
    return `<tr><td data-l="Dia"><b>${d.label}</b></td><td data-l="Situação">${situ}</td>${tm("abertura", "Abertura")}${tm("almocoSaida", "Saída almoço (opc.)", true)}${tm("almocoRetorno", "Retorno almoço (opc.)", true)}${tm("fechamento", "Fechamento")}<td data-l="Duração almoço"><select id="h_${d.id}_duracaoAlmocoMin" ${dis} onchange="upd(e=>e.horarios.${d.id}.duracaoAlmocoMin=Number(this.value),true)">${opt(60, "1h", h.duracaoAlmocoMin)}${opt(90, "1h30", h.duracaoAlmocoMin)}${opt(120, "2h", h.duracaoAlmocoMin)}${opt(180, "3h", h.duracaoAlmocoMin)}</select></td><td data-l="Mín. dia *"><input id="h_${d.id}_minimoFuncionarios" type="number" min="0" max="50" value="${Number(h.minimoFuncionarios || 0)}" style="width:66px" onchange="upd(e=>e.horarios.${d.id}.minimoFuncionarios=Math.max(0,Number(this.value)||0),true)"></td><td data-l="Mín. feriado"><input id="h_${d.id}_minimoFeriado" type="number" min="0" max="50" value="${Number(h.minimoFeriado || 0)}" style="width:66px" onchange="upd(e=>e.horarios.${d.id}.minimoFeriado=Math.max(0,Number(this.value)||0),true)"></td><td data-l="Folgas">${bloqueioHtml}</td><td data-l="Máx. folgas/dia">${maxFolHtml}</td><td data-l="Loja aberta" class="num">${tot}</td></tr>`;
  }).join("");

  const n = (k, l, help, attrs) => `<div class="field"><label for="r_${k}">${l}</label><input type="number" id="r_${k}" value="${esc(R[k])}" ${attrs} onchange="upd(e=>e.regras.${k}=Number(this.value),true)"><span class="help">${help}</span></div>`;
  const checksPref = [1, 2, 3, 4, 5, 6].map(dow => `<label class="check" style="font-size:12px;align-items:center"><input type="checkbox" ${prefSet.has(dow) ? "checked" : ""} onchange="toggleDiaPrefFolga(${dow},this.checked)"> ${DOW[dow]}</label>`).join("");

  const _horarios = `<div class="card"><div class="card-h"><div><h2>Horário de funcionamento, almoço, mínimos e controle de folgas</h2><div class="sub">Preencha <b>Saída</b> e <b>Retorno do almoço</b> só se a loja fecha no almoço. Se não fecha, deixe em branco que o app reveza o almoço da equipe.<span class="req-nota"><b>*</b> Essencial pra escala sair certa. Dá pra salvar sem, o app só avisa.</span></div>${ex(`<ul><li><b>Mín. dia:</b> quantas pessoas, no mínimo, precisam estar na loja nesse dia.</li><li><b>Mín. feriado:</b> o mínimo quando cair feriado nesse dia da semana.</li><li><b>Folgas Liberada/Bloqueada:</b> se alguém pode folgar nesse dia. Ex.: segunda bloqueada porque é dia de mais movimento.</li><li><b>Máx. folgas:</b> quantos podem folgar no mesmo dia. Vazio = o app calcula.</li><li><b>Almoço:</b> quanto tempo cada um tira. Ex.: loja aberta das 07:00 às 20:00, sem fechar no almoço, almoço de 1h: o app põe cada um pra almoçar num horário diferente.</li></ul>`, "O que é cada coluna")}</div><div class="acts"><button type="button" class="btn-ghost" onclick="limparAlmocoFixo()" title="Limpa saída e retorno de almoço de segunda a sábado">Limpar almoço fixo (Seg–Sáb)</button><button type="button" class="btn-ghost" onclick="copiarSegunda()">Copiar segunda para terça a sábado</button></div></div><div class="tbl-wrap"><table class="stack"><thead><tr><th>Dia</th><th>Situação</th><th class="req">Abertura</th><th>Saída almoço <small style="font-weight:400">(opc.)</small></th><th>Retorno almoço <small style="font-weight:400">(opc.)</small></th><th class="req">Fechamento</th><th>Almoço</th><th class="req">Mín. dia</th><th>Mín. feriado</th><th>Folgas</th><th>Máx. folgas</th><th class="num">Loja aberta</th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
  const REGRAS_ABAS = [["jornada", "Jornada e limites"], ["folgas", "Folgas"], ["domfer", "Domingos e feriados"], ["horarios", "Horários e restrições"]];
  const subAba = REGRAS_ABAS.some(([id]) => id === ui.regrasAba) ? ui.regrasAba : "jornada";
  const subTabs = `<div class="cfg-subtabs" role="tablist">${REGRAS_ABAS.map(([id, nome]) => `<button type="button" role="tab" aria-selected="${id === subAba}" class="cfg-subtab ${id === subAba ? "on" : ""}" onclick="ui.regrasAba='${jsa(id)}';render()">${nome}</button>`).join("")}</div>`;
  const REGRAS_GRUPOS = {

      <div class="field"><label for="r_jornada">Jornada padrão da loja (horas por semana)</label><select id="r_jornada" onchange="upd(e=>{e.regras.jornada=Number(this.value);e.regras.divisor=Number(this.value)*5},true)">${opt(44, "44h — regime anterior (até a transição)", R.jornada)}${opt(42, "42h — transição EC 141", R.jornada)}${opt(40, "40h — teto definitivo", R.jornada)}${opt(36, "36h", R.jornada)}${opt(30, "30h", R.jornada)}</select><span class="help">Teto da lei: 44h hoje, 42h a partir de 16/12/2026 e 40h a partir de 16/12/2027.</span></div>
      ${n("maxDias", "Máximo de dias seguidos de trabalho", "Ex.: 5 = depois de 5 dias trabalhando, a pessoa folga.", 'min="1" max="6"')}
      ${n("descanso", "Descanso entre um dia e outro (horas)", "A CLT pede 11h. Ex.: saiu 22:00, só volta 09:00 do dia seguinte.", 'min="8" max="24" step="0.5"')}
      ${n("maxHorasDia", "Máximo de horas por dia", "Mais de 8h por dia só com acordo ou convenção coletiva.", 'min="6" max="12" step="0.5"')}
      ${n("divisor", "Divisor de horas do mês", "Usado só pra calcular o valor da hora (ex.: 220 para 44h). Se não sabe, deixe como está.", 'min="100" max="240"')}
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.completarCargaSemana ? "checked" : ""} onchange="upd(e=>e.regras.completarCargaSemana=this.checked,true)"> Completar as horas da semana quando um dia for curto</label>${ex("Ex.: o domingo só tem 4h de loja aberta e a pessoa ficaria com 36h em vez de 40h. Ligado, o app estica um pouco os outros dias até fechar as 40h. Pode passar de 8h no dia, e aí precisa de acordo.")}</div>

      <div class="field"><label for="r_folgas">Folgas por semana</label><select id="r_folgas" onchange="upd(e=>e.regras.folgasSemana=Number(this.value),true)">${opt(2, "2 folgas (5x2)", R.folgasSemana)}${opt(1, "1 folga", R.folgasSemana)}</select><span class="help">5x2 = 5 dias de trabalho e 2 de folga.</span></div>

      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.folgaSabadoAposDomingo ? "checked" : ""} onchange="upd(e=>e.regras.folgaSabadoAposDomingo=this.checked,true)"> Quem trabalha no domingo folga no sábado seguinte</label><span class="help">Se faltar gente no sábado, a folga vai pra outro dia da semana.</span></div>
      <div class="field span-2"><label for="r_prio">Quando faltar gente no dia, o que garantir primeiro?</label><select id="r_prio" onchange="upd(e=>e.regras.prioridadeMinimo=this.value,true)">${opt("funcao", "As funções obrigatórias (ex.: sempre ter farmacêutico e caixa)", R.prioridadeMinimo)}${opt("geral", "O total de pessoas na loja (Mín. dia em Horários)", R.prioridadeMinimo)}</select><span class="help">O app tenta cumprir os dois. Quando não der, segura o que você escolher aqui e avisa o que faltou.</span>${ex("Ex.: terça com 5 pessoas, 2 de folga e mínimo de 4. Escolhendo <b>funções obrigatórias</b>, o dia fica com 3, mas o farmacêutico está lá.")}<details class="ex"><summary>Como a escala decide quando não cabe tudo</summary><div><ol><li>As ${R.folgasSemana} folga(s) da semana nunca saem.</li><li>Domingo e feriado: primeiro uma pessoa de cada função obrigatória, depois completa até o total do dia.</li><li>Nos outros dias, as folgas são distribuídas respeitando os mínimos e o máximo de dias seguidos.</li><li>Se não couber, afrouxa uma coisa por vez, nesta ordem: o cuidado com o domingo da semana seguinte → folga num dia bloqueado (só para não passar dos dias seguidos) → 6 dias seguidos → o mínimo que você não escolheu acima → o outro mínimo → o máximo de folgas por dia.</li></ol>Tudo que foi afrouxado aparece nos alertas.</div></details></div>
      <div class="field span-2" style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px"><label class="check" style="font-weight:600"><input type="checkbox" ${R.folgaAniversario ? "checked" : ""} onchange="const on=this.checked;upd(e=>{e.regras.folgaAniversario=on;if(on)e.regras.inicioAniversario=mesAtual();},true)"> Folga no aniversário do colaborador</label><span class="help">Na semana do aniversário, uma das folgas cai no dia do aniversário. Usa a data de nascimento cadastrada em Equipe.</span>${ex(`<ul><li>Trabalhou no domingo: folga no sábado e no aniversário.</li><li>Semana com feriado: aniversário + feriado (o sábado sai).</li><li>Aniversário no domingo ou feriado em que estaria escalado: sai da escala desse dia.</li><li>Folgou no domingo e a semana tem feriado: domingo + feriado + aniversário (3 folgas).</li><li>Aniversário nas férias: fica férias, não vira folga em outro dia.</li><li>Se faltar gente no dia, a cobertura vem primeiro e o app avisa.</li></ul>`, "Como funciona")}</div>
      ${R.folgaAniversario ? `<div class="field"><label for="r_ini_aniv">Vale a partir de</label><input id="r_ini_aniv" type="month" value="${esc(R.inicioAniversario || "")}" onchange="if(this.value)upd(e=>e.regras.inicioAniversario=this.value,true)"><span class="help">Ao ligar, começa no mês atual. Meses anteriores ficam como estavam.</span></div><div class="field"><span class="help" style="padding-top:22px;display:block">${(() => { const sem = E.equipe.filter(c => c.status === "Ativo" && !c.nascimento).map(nomeCurto); return sem.length ? `Sem data de nascimento: ${esc(sem.join(", "))}.` : "Todos os ativos têm data de nascimento."; })()}</span></div>` : ""}`,
    domfer: () => `
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.evitarDomFerSequencia ? "checked" : ""} onchange="upd(e=>e.regras.evitarDomFerSequencia=this.checked,true)"> Evitar que a mesma pessoa pegue dois domingos ou feriados seguidos</label></div>
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.filaPorFuncao ? "checked" : ""} onchange="upd(e=>e.regras.filaPorFuncao=this.checked,true)"> Rodízio separado por função</label><span class="help">Cada função reveza só entre os seus. Usa o mínimo de domingo e feriado de cada função (em Funções).</span>${ex("Ex.: 2 farmacêuticos e 4 balconistas, e no domingo precisa de 1 de cada. Ligado: os 2 farmacêuticos se revezam (um domingo cada) e os 4 balconistas também (cada um pega 1 a cada 4 domingos). Desligado: uma fila só pra loja toda.")}</div>
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.priorizarFeriadoFolga ? "checked" : ""} onchange="upd(e=>e.regras.priorizarFeriadoFolga=this.checked,true)"> A folga do feriado conta como uma das folgas da semana</label>${ex("Ex.: feriado na quarta. Ligado: a pessoa folga quarta (feriado) e mais 1 dia = 2 folgas. Desligado: folga quarta e mais 2 dias = 3 folgas.")}</div>
      <div class="field"><label for="r_ini_saldo">Contar folgas de feriado a partir de</label><input id="r_ini_saldo" type="month" value="${esc(R.inicioSaldo || "")}" onchange="if(this.value)upd(e=>e.regras.inicioSaldo=this.value,true)"><span class="help">Só feriado trabalhado a partir deste mês vira folga pra tirar depois.</span>${ex("Se alguém já tinha folga pra tirar antes de usar o app, lance em Compensações → Crédito.")}</div>
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.domingoNaoFecha !== false ? "checked" : ""} onchange="upd(e=>e.regras.domingoNaoFecha=this.checked,true)"> Quem trabalha no domingo não fica no fechamento da loja durante a semana</label></div>
      <div class="field span-2" style="border-top:1px solid var(--line);padding-top:12px;margin-top:4px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
          <label class="check" style="font-weight:600"><input type="checkbox" ${R.usarOrdemPersonalizadaDomFer ? "checked" : ""} onchange="upd(e=>e.regras.usarOrdemPersonalizadaDomFer=this.checked,true)"> Escolher a ordem do rodízio de domingos e feriados</label>
          ${R.usarOrdemPersonalizadaDomFer ? `<button type="button" class="btn-ghost btn-sm" onclick="sincronizarOrdemDomFer()">Sincronizar com equipe</button>` : ""}

          return `<span class="turno-chip" style="background:#F1F5F9;color:#0F172A;border:1px solid var(--line-2);padding:5px 10px"><b>${idx + 1}.</b> ${esc(nomeCurto(col))} <button type="button" ${idx === 0 ? "disabled style='opacity:.3'" : ""} onclick="moverOrdemDomFer(${idx},-1)">↑</button> <button type="button" ${idx === arr.length - 1 ? "disabled style='opacity:.3'" : ""} onclick="moverOrdemDomFer(${idx},1)">↓</button></span>`;
        }).join("")}</div><span class="help">Use as setas pra pôr na ordem. Desligado, segue a ordem da Equipe.</span>` : ""}
        <div class="grid g3" style="margin-top:12px;align-items:start">
          <div class="field"><label>Rodízio começa em</label>${campoData(R.ancoraDomFerISO, `e.regras.ancoraDomFerISO=v||'${String(E.competencia || mesAtual()).slice(0, 4)}-01-01'`, 'style="width:130px"')}<span class="help">O ${R.usarOrdemPersonalizadaDomFer ? "1º da lista" : "1º da equipe"} trabalha no primeiro domingo ou feriado a partir desta data. Depois segue a ordem.</span>${ex("Ex.: data 20/12/2026 e ordem Ana, Bruno, Carla. Ana pega o domingo 20/12, Bruno o próximo domingo ou feriado, Carla o seguinte, e volta pra Ana. Quem for contratado entra no fim da fila. Quem está de férias ou ainda não foi admitido é pulado.")}</div>
          <div class="field span-2"><div class="lbl-f">Próximos domingos e feriados</div><div class="help" style="color:var(--ink-2);line-height:1.7">${previaRodizio(R.ancoraDomFerISO, 8)}</div></div>
        </div>
      </div>`,
    horarios: () => `
      <div class="field"><label for="r_passo">Horário de entrada da equipe</label><select id="r_passo" onchange="upd(e=>e.regras.passoHorario=Number(this.value),true)">${opt(60, "Hora cheia (7h, 8h, 9h…)", passoHorario())}${opt(30, "De meia em meia hora (7h, 7h30, 8h…)", passoHorario())}${opt(15, "De 15 em 15 min (7h, 7h15, 7h30…)", passoHorario())}</select><span class="help">Quando tem gente entrando em horários diferentes no dia.${ex("<b>Hora cheia:</b> um entra 7h, outro 8h, outro 9h.<br><b>Meia hora:</b> pode entrar 8h30.<br>A abertura e o fechamento da loja sempre ficam cobertos, mesmo que a loja feche num horário quebrado (ex.: 19h30).", "Ver exemplo")}</span></div>
      <div class="field span-2"><label for="r_trat">Faculdade ou estágio: o que fazer com as horas que a pessoa não trabalha?</label><select id="r_trat" onchange="upd(e=>e.regras.tratRestricao=this.value,true)">${Object.entries(TRAT_REST).map(([k, v]) => opt(k, v, R.tratRestricao)).join("")}</select><span class="help">Esse é o padrão da empresa. Cada restrição pode ter outro em Equipe.</span>${ex(`<ul><li><b>Abonar:</b> a empresa não desconta. É uma escolha dela, a CLT não obriga.</li><li><b>Descontar:</b> as horas saem do salário.</li><li><b>Compensar:</b> a pessoa repõe as horas em outros dias.</li></ul>Descontar e compensar precisam ser combinados com o colaborador.`, "O que muda em cada opção")}</div>
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.rodizioHorarios ? "checked" : ""} onchange="upd(e=>e.regras.rodizioHorarios=this.checked,true)"> Revezar os horários entre a equipe</label><span class="help">Ex.: quem abriu a loja hoje não abre amanhã.</span></div>
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.exibirTurnosPartidos ? "checked" : ""} onchange="upd(e=>e.regras.exibirTurnosPartidos=this.checked,true)"> Mostrar o horário com o almoço (manhã / tarde)</label><span class="help">Ex.: 08:00–12:00 / 14:00–18:00 em vez de 08:00–18:00.</span></div>
      <div class="field"><label class="check" style="font-weight:500;padding-top:8px"><input type="checkbox" ${R.ajustarCargaFracionada ? "checked" : ""} onchange="upd(e=>e.regras.ajustarCargaFracionada=this.checked,true)"> Fechar carga quebrada com um dia mais curto</label><span class="help">Ex.: 36h por semana vira 4 dias de 8h e 1 dia de 4h, em vez de 5 dias de 7h12.</span></div>`,
  };
  const _regras = `<div class="card"><div class="card-h"><div><h2>Regras da escala</h2><div class="sub">Separadas por assunto. Tudo é opcional: o app avisa, não bloqueia.</div></div></div>${subTabs}
    <div class="grid g3">${REGRAS_GRUPOS[subAba]()}
    </div></div>`;

  const ids = Object.keys(S.empresas);
  if (ids.length) { trocarEmpresa(ids[0]); ir("painel"); }
  else { E = null; S.ativa = ""; view = "empresas_master"; S.ui.view = "empresas_master"; salvarJa(); render(); }
}

}

function importarJSON(ev) {
  if (!isMaster()) return toast("Apenas o administrador Master pode importar backups.");
  const file = ev.target.files?.[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      if (j.tipo === "escalalocal-completo" && estadoValido(j.estado)) {
        if (!rd.__ok) return confirmar("Restaurar o backup completo vai SUBSTITUIR todas as empresas e usuários atuais. Continuar?", () => { rd.__ok = true; rd.onload(); }, "Restaurar");
        const logado = usuarioAtual()?.id;
        S = prepararEstado({ ...j.estado, sessao: { userId: logado } });
        E = null; S.ativa = "";
        salvarJa(); render(); toast("Backup completo restaurado.");
        return;
      }
      const emp = j.empresa && j.empresa.equipe ? j.empresa : (j.equipe ? j : null);
      if (!emp) throw 0;
      emp.id = uid("emp"); S.empresas[emp.id] = normalizar(emp); trocarEmpresa(emp.id); toast("Backup importado como nova empresa.");
    } catch { toast("Arquivo inválido."); }
  };
  rd.readAsText(file); ev.target.value = "";
}
