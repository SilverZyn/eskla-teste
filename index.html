<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eskla — Gestão de Escalas</title>
<style id="pageStyle">@page { size: A4 landscape; margin: 10mm; }</style>
<style>
/*
  VOICE: produto SaaS de gestão — calmo, objetivo, confiável.
  IDEA: o quadro de escala pendurado no balcão da loja, digitalizado.
  PICTURE: a grade mensal colorida por status é o elemento central.
  COLOUR/TYPE: cor da marca do cliente na lateral; status com cores fixas (verde trabalha/aberto, vermelho fechado/falta).
  LAYOUT: lateral retrátil + topo com mês + conteúdo em blocos.
*/
:root {
  --brand: #0F766E; --on-brand: #fff;
  --side: color-mix(in srgb, var(--brand) 16%, #0B1220);
  --side-2: color-mix(in srgb, var(--brand) 26%, #0F172A);
  --ink: #0F172A; --ink-2: #334155; --muted: #64748B;
  --line: #E2E8F0; --line-2: #CBD5E1; --bg: #F4F6FA; --card: #fff;
  --radius: 12px; --shadow: 0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.05);

  --green: #16A34A; --green-bg: #DCFCE7; --green-tx: #166534;
  --red: #DC2626;   --red-bg: #FEE2E2;   --red-tx: #991B1B;
  --amber-bg: #FEF3C7; --amber-tx: #92400E;
  --blue-bg: #DBEAFE;  --blue-tx: #1E40AF;
  --violet-bg: #EDE9FE; --violet-tx: #5B21B6;
  --rose-bg: #FFE4E6; --rose-tx: #BE123C;
  --teal-bg: #CCFBF1; --teal-tx: #0F766E;
  --gray-bg: #F1F5F9; --gray-tx: #64748B;
}
* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; }
body { font: 14px/1.45 Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: clip; }
button, input, select, textarea { font: inherit; }

/* ---------- Estrutura ---------- */
.app { display: grid; grid-template-columns: 256px minmax(0,1fr); min-height: 100vh; transition: grid-template-columns .2s ease; }
body.side-mini .app { grid-template-columns: 72px minmax(0,1fr); }

.sidebar { background: var(--side); color: #CBD5E1; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; z-index: 40; }
.side-scroll { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; font-weight: 800; font-size: 15px; flex-shrink: 0; overflow: hidden; }
.logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-txt { overflow: hidden; }
.brand-name { color: #fff; font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-sub { font-size: 11px; color: #94A3B8; white-space: nowrap; }
.emp-switch { display: flex; gap: 6px; }
.emp-switch select { flex: 1; background: var(--side-2); color: #E2E8F0; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 7px 8px; font-size: 12.5px; }
.emp-switch button { background: var(--side-2); color: #E2E8F0; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; width: 34px; padding: 0; justify-content: center; font-size: 17px; }
.nav-group { display: grid; gap: 2px; }
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #64748B; padding: 4px 10px; white-space: nowrap; }
.nav-btn { display: flex; align-items: center; gap: 11px; width: 100%; background: transparent; color: #CBD5E1; border: 0; padding: 9px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left; white-space: nowrap; }
.nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; opacity: .85; }
.nav-btn:hover { background: var(--side-2); color: #fff; }
.nav-btn.active { background: color-mix(in srgb, var(--brand) 55%, transparent); color: #fff; }
.nav-btn .count { margin-left: auto; background: var(--red); color: #fff; border-radius: 999px; font-size: 10.5px; padding: 1px 7px; font-weight: 700; }
.side-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); display: grid; gap: 8px; }
.rule-chip { background: var(--side-2); border-radius: 9px; padding: 10px 12px; font-size: 11.5px; color: #94A3B8; line-height: 1.5; }
.rule-chip strong { color: #E2E8F0; display: block; font-size: 12px; }
.plan { font-size: 11px; color: #94A3B8; padding: 0 4px; white-space: nowrap; }
body.side-mini .brand-txt, body.side-mini .nav-label, body.side-mini .nav-btn span, body.side-mini .emp-switch, body.side-mini .side-foot, body.side-mini .nav-btn .count { display: none; }
body.side-mini .nav-btn { justify-content: center; }
body.side-mini .brand { justify-content: center; }

.content { display: flex; flex-direction: column; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,246,250,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.icon-btn { width: 38px; height: 38px; padding: 0; justify-content: center; background: #fff; border: 1px solid var(--line-2); color: var(--ink-2); }
.icon-btn svg { width: 18px; height: 18px; }
.top-title { flex: 1; min-width: 180px; }
.top-title h1 { margin: 0; font-size: 18px; letter-spacing: -.3px; }
.top-title p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }
.month-nav { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; }
.month-nav button { background: transparent; border: 0; width: 32px; height: 32px; padding: 0; justify-content: center; color: var(--ink-2); font-size: 16px; }
.month-nav button:hover { background: var(--gray-bg); }
.month-nav .lbl { font-weight: 700; font-size: 13.5px; min-width: 128px; text-align: center; text-transform: capitalize; }
.save-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
main { padding: 22px 24px 60px; display: grid; gap: 18px; max-width: 1640px; width: 100%; }
.overlay { display: none; }

/* ---------- Componentes ---------- */
button { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, filter .15s; }
button:active { transform: translateY(1px); }
.btn-primary { background: var(--brand); color: var(--on-brand); }
.btn-primary:hover { filter: brightness(.92); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-ghost { background: #fff; color: var(--ink-2); border-color: var(--line-2); }
.btn-ghost:hover { background: var(--gray-bg); }
.btn-danger { background: #fff; color: var(--red-tx); border-color: #FECACA; }
.btn-danger:hover { background: #FEF2F2; }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
.btn-wa { background: #16A34A; color: #fff; }
.btn-wa:hover { background: #15803D; }
a.btn-wa { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 600; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.card-h h2 { margin: 0; font-size: 15px; letter-spacing: -.2px; }
.card-h .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.card-h .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.span-2 { grid-column: span 2; }
@media (max-width: 700px) { .span-2 { grid-column: auto; } }

.field { display: flex; flex-direction: column; gap: 5px; }
label, .lbl-f { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.help { font-size: 11.5px; color: var(--muted); font-weight: 400; line-height: 1.4; }
input, select, textarea { padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; color: var(--ink); font-size: 13.5px; width: 100%; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
input[type=color] { padding: 2px; height: 38px; width: 56px; }
input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--brand); margin: 0; }
input.invalid { border-color: var(--red); }
textarea { resize: vertical; min-height: 150px; line-height: 1.5; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: #F8FAFC; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
.check input { margin-top: 2px; }
.form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th { background: #F8FAFC; color: var(--muted); text-align: left; padding: 9px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; border-bottom: 1px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid #F1F5F9; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input, td select { padding: 6px 8px; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px !important; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap; }
.b-green { background: var(--green-bg); color: var(--green-tx); }
.b-red { background: var(--red-bg); color: var(--red-tx); }
.b-amber { background: var(--amber-bg); color: var(--amber-tx); }
.b-blue { background: var(--blue-bg); color: var(--blue-tx); }
.b-gray { background: var(--gray-bg); color: var(--gray-tx); }
.b-teal { background: var(--teal-bg); color: var(--teal-tx); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }

/* Interruptor aberto/fechado */
.toggle { border: 0; border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 12px; font-weight: 700; gap: 7px; }
.toggle.on { background: var(--green-bg); color: var(--green-tx); }
.toggle.off { background: var(--red-bg); color: var(--red-tx); }
.toggle .knob { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 14px; }
.kpi { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); border-top: 3px solid var(--line-2); }
.kpi-l { font-size: 12px; color: var(--muted); font-weight: 600; }
.kpi-v { font-size: clamp(22px, 2.4vw, 28px); font-weight: 800; letter-spacing: -.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi-h { font-size: 12px; color: var(--muted); }
.kpi.ok { border-top-color: var(--green); } .kpi.ok .kpi-v { color: var(--green-tx); }
.kpi.warn { border-top-color: #F59E0B; } .kpi.warn .kpi-v { color: #B45309; }
.kpi.bad { border-top-color: var(--red); } .kpi.bad .kpi-v { color: var(--red-tx); }
.kpi.kb { border-top-color: var(--brand); }

/* Status da escala — cores fixas em todo o sistema */
.s-trab { background: var(--green-bg); color: var(--green-tx); }
.s-fertrab { background: #BBF7D0; color: #14532D; box-shadow: inset 0 0 0 2px #60A5FA; }
.s-ferpago { background: #A7F3D0; color: #064E3B; box-shadow: inset 0 0 0 2px #34D399; }
.s-folga { background: var(--amber-bg); color: var(--amber-tx); }
.s-feriado { background: var(--blue-bg); color: var(--blue-tx); }
.s-comp { background: var(--teal-bg); color: var(--teal-tx); }
.s-fechado { background: #FEF2F2; color: #B91C1C; }
.s-ferias { background: var(--violet-bg); color: var(--violet-tx); }
.s-afast { background: var(--rose-bg); color: var(--rose-tx); }
.s-falta { background: #FED7AA; color: #9A3412; }

.grade th, .grade td { padding: 4px 3px; text-align: center; }
.grade th:first-child, .grade td:first-child { position: sticky; left: 0; z-index: 2; background: #fff; text-align: left; padding: 6px 12px; min-width: 168px; border-right: 1px solid var(--line); }
.grade th:first-child { background: #F8FAFC; }
.grade tfoot td:first-child { background: #F8FAFC; }
.grade th.d { min-width: 52px; line-height: 1.15; }
.grade th.d b { display: block; font-size: 13px; color: var(--ink); }
.grade th.d small { font-size: 10px; }
.grade th.dom { background: #EEF2F7; }
.grade th.fer { background: var(--blue-bg); }
.grade th.fer small { color: var(--blue-tx); }
.grade td.tot { font-weight: 700; font-variant-numeric: tabular-nums; padding: 0 10px; white-space: nowrap; }
.nome { font-weight: 650; font-size: 13px; white-space: nowrap; }
.meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.cell { width: 100%; min-width: 48px; justify-content: center; padding: 7px 3px; border-radius: 7px; font-size: 10.5px; font-weight: 700; border: 1px solid transparent; position: relative; font-variant-numeric: tabular-nums; }
.cell:hover { border-color: rgba(15,23,42,.25); }
.cell.manual::after { content: ""; position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #2563EB; }
.cell.troca::before { content: ""; position: absolute; top: 3px; left: 3px; width: 6px; height: 6px; border-radius: 50%; background: #DB2777; }
.cov { display: inline-block; min-width: 28px; padding: 3px 0; border-radius: 6px; font-size: 11px; font-weight: 800; }
.cov.c0 { background: var(--red-bg); color: var(--red-tx); }
.cov.c1 { background: var(--amber-bg); color: var(--amber-tx); }
.cov.c2 { background: var(--green-bg); color: var(--green-tx); }
.cov.cx { background: var(--gray-bg); color: var(--gray-tx); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }

.alerts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-height: 460px; overflow-y: auto; }
.alerts li { padding: 9px 12px; border-radius: 9px; font-size: 12.5px; border-left: 4px solid; display: flex; gap: 8px; }
.al-err { background: #FEF2F2; color: var(--red-tx); border-color: var(--red) !important; }
.al-warn { background: #FFFBEB; color: #92400E; border-color: #F59E0B !important; }
.al-info { background: #EFF6FF; color: var(--blue-tx); border-color: #3B82F6 !important; }
.al-ok { background: #F0FDF4; color: var(--green-tx); border-color: var(--green) !important; }

.bar { height: 8px; background: var(--gray-bg); border-radius: 999px; overflow: hidden; min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }

.onb { border-color: color-mix(in srgb, var(--brand) 35%, #fff); background: linear-gradient(180deg, color-mix(in srgb, var(--brand) 7%, #fff), #fff 70%); }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
.steps li { display: flex; gap: 10px; align-items: center; font-size: 13.5px; }
.steps li span { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
.steps li.ok { color: var(--muted); text-decoration: line-through; }
.steps li.ok span { background: var(--green); border-color: var(--green); }

.saldo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.saldo { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.saldo .n { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
.saldo.pos .n { color: var(--teal-tx); } .saldo.neg .n { color: var(--red-tx); } .saldo.zero .n { color: var(--muted); }

.wa-card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.wa-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.wa-card textarea { min-height: 150px; }

/* Folhas imprimíveis */
.sheet-h { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 2px solid var(--brand); }
.sheet-h .logo { width: 52px; height: 52px; }
.sheet-h h3 { margin: 0; font-size: 17px; }
.sheet-h p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.sheet-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; margin-bottom: 14px; }
.sheet-meta div { background: #F8FAFC; padding: 9px 12px; font-size: 13px; }
.sheet-meta small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.sign { margin-top: 46px; display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.sign div { border-top: 1px solid #334155; padding-top: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.sheet-foot { margin-top: 14px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

.logo-up { display: flex; gap: 14px; align-items: center; }
.logo-up .logo { width: 72px; height: 72px; font-size: 22px; border-radius: 14px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; padding: 0; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-2); }
.swatches button.sel { box-shadow: 0 0 0 2px var(--ink); }

.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 80; }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 460px; padding: 22px; display: grid; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
.modal h3 { margin: 0; font-size: 16px; }
.toast { position: fixed; bottom: 20px; right: 20px; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: all .2s; pointer-events: none; z-index: 90; max-width: calc(100vw - 40px); }
.toast.show { opacity: 1; transform: none; }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .app, body.side-mini .app { grid-template-columns: minmax(0,1fr); }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 270px; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  body.side-open .sidebar { transform: none; }
  body.side-mini .brand-txt, body.side-mini .nav-label, body.side-mini .nav-btn span, body.side-mini .emp-switch, body.side-mini .side-foot { display: revert; }
  body.side-mini .nav-btn { justify-content: flex-start; }
  body.side-open .overlay { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 35; }
  .topbar { padding: 10px 14px; gap: 10px; }
  .top-title { order: 2; flex-basis: calc(100% - 60px); }
  .month-nav { order: 3; }
  .save-state { order: 4; }
  main { padding: 14px 12px 50px; }
  .card { padding: 14px; }
  .stack thead { display: none; }
  .stack tr { display: grid; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .stack td { display: flow-root; border: 0; padding: 3px 0; padding-inline-start: 8.5em; text-align: start; }
  .stack td::before { content: attr(data-l); float: inline-start; width: 8em; margin-inline-start: -8.5em; color: var(--muted); font-size: 12px; font-weight: 600; }
  .stack td:empty { display: none; }
  .sign { grid-template-columns: 1fr; gap: 34px; }
}

/* ---------- Impressão ---------- */
@media print {
  body { background: #fff; }
  body.imprimindo * { visibility: hidden; }
  body.imprimindo .print-on, body.imprimindo .print-on * { visibility: visible; }
  body.imprimindo .print-on { position: absolute; left: 0; top: 0; width: 100%; border: 0; box-shadow: none; padding: 0; }
  .no-print { display: none !important; }
  .tbl-wrap { overflow: visible; border: 0; }
  .grade th:first-child, .grade td:first-child { position: static; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table { font-size: 10.5px; }
}

/* Cobertura abaixo do mínimo (0.5.0) */

<script>

/* ---------------- Feriados nacionais (cálculo da Páscoa) ---------------- */
function pascoa(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),

}
function feriadosNacionais(y) {
  return [[`${y}-01-01`, "Confraternização Universal"], [isoOf(addDias(pascoa(y), -2)), "Paixão de Cristo"], [`${y}-04-21`, "Tiradentes"],
    [`${y}-05-01`, "Dia do Trabalho"], [`${y}-09-07`, "Independência do Brasil"], [`${y}-10-12`, "Nossa Senhora Aparecida"],
    [`${y}-11-02`, "Finados"], [`${y}-11-15`, "Proclamação da República"], [`${y}-11-20`, "Dia Nacional de Zumbi e da Consciência Negra"], [`${y}-12-25`, "Natal"]];
}

/* ============================================================
   MOTOR DE ESCALA (0.5.0 — guiado por funções e mínimos)
   Semanas de segunda a domingo. Ordem de prioridade:
   a) situações fixas: ajustes manuais, férias, afastamentos, faltas,
      folgas compensatórias, feriados de folga geral e dias fechados;
   b) feriados abertos: escala primeiro o mínimo de cada função,
      depois completa o mínimo geral do feriado; os demais folgam;
   c) folgas semanais: cada pessoa recebe as folgas que a semana exige,
      nos dias permitidos e onde sobra mais gente, sem deixar função
      ou loja abaixo do mínimo sempre que houver alternativa;

   Nunca tira folga semanal nem aumenta carga para cobrir mínimo:

   Depois: limite de dias seguidos e trocas pontuais.

function horasDiaCol(c, R = E.regras) {
  const diasTrab = 7 - (Number(R.folgasSemana) || 2);
  return Math.min(10, Math.round((Number(c.carga) || 0) / diasTrab * 100) / 100);
}
const ehFolgaSemanal = (st, R = E.regras) => st === "FOLGA" || st === "FECHADO" || (st === "FER_FOLGA" && !!R.priorizarFeriadoFolga);
function minimosDoDia(d) {
  if (!d.aberto) return { geral: 0, porFuncao: {} };
  const porFuncao = {};
  E.funcoes.forEach(f => { const n = Number(d.fer ? f.minFeriado : f.minUtil) || 0; if (n > 0) porFuncao[f.id] = n; });
  return { geral: Number(d.cfg?.minimo) || 0, porFuncao };
}
// Bloqueio de folga vale para o dia da semana; em feriado é desconsiderado.
const folgaPermitida = d => !!d.fer || !E.horarios[d.wkey]?.bloqueiaFolga;

function janelasDoDia(c, d) {
  const f = funcaoDe(c), cfg = d.cfg || {};

    const dentro = jan.map(([a, b]) => [Math.max(a, ab), Math.min(b, fe)]).filter(([a, b]) => b > a);
    if (dentro.length) jan = dentro;

function turnoContinuo(h, a, b, ci, pausaPadrao) {
  const dur = Math.round(h * 60) + pausaPadrao;

  else if (ci % 2 === 0) { ini = a; fim = a + dur; }   // abre
  else { fim = b; ini = b - dur; }                      // fecha

// Turnos da função = janelas de disponibilidade. Encaixa a carga do dia nelas;
// o espaço entre duas janelas funciona como intervalo.
function turno(c, ci, d) {

  const base = R.inicioRevezamento ? parseISO(R.inicioRevezamento) : new Date(2026, 0, 4);

  const domingos = {};
  fila.forEach((c, i) => domingos[c.id] = ((((i - k0) % fila.length) + fila.length) % fila.length) / fila.length);

  for (let w = 0; w < dias.length / 7; w++) {
    const sem = dias.slice(w * 7, w * 7 + 7);

    // Domingo: quem não faz revezamento folga (conta como folga semanal)
    sem.filter(d => d.dow === 0 && d.aberto && !d.fer).forEach(d => equipe.forEach(c => { if (livre(c, d) && !c.domingo) G[c.id][d.iso] = { st: "FOLGA" }; }));

    // b) Feriados abertos: mínimo por função, depois mínimo geral; demais folgam
    sem.filter(d => d.fer && d.aberto).forEach(d => {
      const stTrab = d.fer.tratamento === "COMP" ? "FER_TRAB_COMP" : "FER_TRAB_PAGO";
      const eleg = equipe.filter(c => livre(c, d) && (d.dow !== 0 || c.domingo));
      const start = eleg.length ? (Math.max(0, ferRot.indexOf(d.iso)) % eleg.length) : 0;
      const ordem = eleg.map((_, i) => eleg[(start + i) % eleg.length]);
      const esc = new Set();
      const contaF = fid => equipe.filter(c => c.funcaoId === fid && (esc.has(c.id) || (G[c.id][d.iso] && ST[G[c.id][d.iso].st]?.trab))).length;
      const contaG = () => esc.size + equipe.filter(c => G[c.id][d.iso] && ST[G[c.id][d.iso].st]?.trab).length;
      const { geral, porFuncao } = minimosDoDia(d);
      Object.entries(porFuncao).forEach(([fid, n]) => { for (const c of ordem) { if (contaF(fid) >= n) break; if (c.funcaoId === fid) esc.add(c.id); } });
      for (const c of ordem) { if (contaG() >= geral) break; esc.add(c.id); }
      eleg.forEach(c => G[c.id][d.iso] = esc.has(c.id) ? { st: stTrab, pend: true } : { st: "FER_FOLGA" });
    });

    // c) Folgas semanais
    const precisa = {};
    equipe.forEach(c => {
      const disp = sem.filter(d => !["FERIAS", "AFAST"].includes(G[c.id][d.iso]?.st)).length;
      const n = Math.round((Number(R.folgasSemana) || 2) * disp / 7) - sem.filter(d => ehFolgaSemanal(G[c.id][d.iso]?.st, R)).length;
      precisa[c.id] = Math.max(0, n);
    });
    // Quem trabalhou mais domingos escolhe primeiro (e tende a folgar no domingo): revezamento contínuo entre meses.
    const n = equipe.length || 1;
    const ordem = [...equipe].sort((a, b) => (domingos[b.id] ?? -1) - (domingos[a.id] ?? -1) || ((idx[a.id] - w) % n + n) % n - ((idx[b.id] - w) % n + n) % n);
    const pontua = (c, d) => {
      const { geral, porFuncao } = minimosDoDia(d);
      const minF = porFuncao[c.funcaoId] || 0, exige = Math.max(geral, Object.values(porFuncao).reduce((s, n) => s + n, 0));
      const tot = noDia(d), fun = c.funcaoId ? daFuncao(d, c.funcaoId) : 0;
      const okF = !minF || fun - 1 >= minF, okG = !d.aberto || tot - 1 >= geral;
      return [folgaPermitida(d) ? 1 : 0, okF && okG ? 1 : 0, okF ? 1 : 0, d.aberto ? tot - exige : 99, minF ? fun - minF : 99,
        d.dow === 0 ? (domingos[c.id] || 0) : 0, -((d.dow + idx[c.id] * 2 + w) % 7)];
    };
    const melhor = (a, b) => { for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i]; return false; };
    let mudou = true;
    while (mudou) {
      mudou = false;
      for (const c of ordem) {
        if (!precisa[c.id]) continue;
        const cands = sem.filter(d => livre(c, d));
        if (!cands.length) { precisa[c.id] = 0; continue; }
        let best = cands[0], bs = pontua(c, best);
        for (const d of cands.slice(1)) { const s = pontua(c, d); if (melhor(s, bs)) { best = d; bs = s; } }
        G[c.id][best.iso] = { st: "FOLGA" };
        if (!bs[0] && best.dentro) meta.folgaBloqueada.push({ colId: c.id, iso: best.iso });
        precisa[c.id]--; mudou = true;
      }
    }

    // d) Turnos (alternância de abertura e fechamento dentro de cada função)
    sem.forEach(d => {
      const pos = {};
      equipe.forEach(c => {
        const cel = G[c.id][d.iso];
        if (cel && !cel.pend) return;
        const chave = c.funcaoId || "_", ci = (pos[chave] = (pos[chave] ?? -1) + 1) + w;
        G[c.id][d.iso] = { st: cel?.st || "TRAB", ...turno(c, ci, d) };
      });
      fila.forEach(c => { if (d.dow === 0 && ST[G[c.id][d.iso]?.st]?.trab) domingos[c.id] = (domingos[c.id] || 0) + 1; });
    });
  }

  // Limite de dias seguidos: vira folga extra (ajustes manuais são respeitados)
  equipe.forEach(c => {
    let seq = 0;
    dias.forEach(d => {
      const cel = G[c.id][d.iso];
      if (ST[cel.st]?.trab) {
        seq++;
        if (seq > (Number(R.maxDias) || 6) && cel.st === "TRAB" && !cel.manual && d.dow !== 0) { G[c.id][d.iso] = { st: "FOLGA", extra: true }; seq = 0; }
      } else seq = 0;
    });
  });

  // Trocas pontuais
  E.trocas.forEach(t => {
    if (!G[t.colA]?.[t.data] || !G[t.colB]?.[t.data]) return;
    const a = G[t.colA][t.data], b = G[t.colB][t.data];
    G[t.colA][t.data] = { ...b, troca: true };
    G[t.colB][t.data] = { ...a, troca: true };
  });

  const semanas = [];
  for (let w = 0; w < dias.length / 7; w++) semanas.push(dias.slice(w * 7, w * 7 + 7));
  return { ano, mes, dias, diasMes: dias.filter(d => d.dentro), semanas, G, equipe, meta };
}

/* Dias abaixo do mínimo (geral e por função), para alertas e destaque no painel. */
function deficits(r = calc) {
  const out = [];
  const Eo = E;
  r.diasMes.forEach(d => {
    const { geral, porFuncao } = minimosDoDia(d);
    if (!d.aberto) return;
    const trab = r.equipe.filter(c => ST[r.G[c.id][d.iso]?.st]?.trab);
    if (trab.length < geral) out.push({ iso: d.iso, dia: d, funcaoId: null, nome: "Loja", tem: trab.length, min: geral });
    Object.entries(porFuncao).forEach(([fid, n]) => {
      const tem = trab.filter(c => c.funcaoId === fid).length;
      if (tem < n) out.push({ iso: d.iso, dia: d, funcaoId: fid, nome: E.funcoes.find(f => f.id === fid)?.nome || "Função", tem, min: n });
    });
  });
  E = Eo;
  return out;
}

/* ---------------- Compensações (razão de créditos e usos) ---------------- */
function razao() {
  if (razaoCache) return razaoCache;
  const L = [];
  const meses = [...new Set(E.feriados.filter(f => f.tratamento === "COMP").map(f => f.data.slice(0, 7)))];
  meses.forEach(m => {
    const r = m === E.competencia ? calc : gerarEscala(E, m);
    E.feriados.filter(f => f.tratamento === "COMP" && f.data.startsWith(m)).forEach(f => {
      Object.keys(r.G).forEach(cid => {
        if (r.G[cid][f.data]?.st === "FER_TRAB_COMP") L.push({ colId: cid, data: f.data, qtd: 1, desc: `Trabalhou no feriado: ${f.descricao}`, origem: "Automático" });
      });
    });
  });
  E.compensacoes.forEach(x => L.push({
    id: x.id, colId: x.colId, data: x.data, qtd: x.tipo === "CREDITO" ? 1 : -1, tipo: x.tipo, origem: "Lançamento",
    desc: (x.tipo === "FOLGA" ? "Folga compensatória tirada" : x.tipo === "PAGAMENTO" ? "Compensado em pagamento" : "Crédito lançado") + (x.motivo ? ` — ${x.motivo}` : "")
  }));
  L.sort((a, b) => a.data.localeCompare(b.data));
  razaoCache = L;
  return L;
}
function saldoCol(cid) {
  const L = razao().filter(l => l.colId === cid);
  const ganho = L.filter(l => l.qtd > 0).reduce((s, l) => s + l.qtd, 0), usado = -L.filter(l => l.qtd < 0).reduce((s, l) => s + l.qtd, 0);
  return { ganho, usado, saldo: ganho - usado };
}

/* ---------------- Resumo e alertas ---------------- */
function resumoCol(c) {
  const r = { trab: 0, horas: 0, folgas: 0, ferFolga: 0, comp: 0, ferias: 0, afast: 0, faltas: 0, domingos: 0, ferTrab: 0, ferPago: 0 };
  calc.diasMes.forEach(d => {
    const cel = calc.G[c.id]?.[d.iso]; if (!cel) return;
    const s = cel.st;
    if (ST[s]?.trab) { r.trab++; r.horas += Number(cel.horas) || 0; if (d.dow === 0) r.domingos++; }
    if (s === "FOLGA" || s === "FECHADO") r.folgas++;
    if (s === "FER_FOLGA") r.ferFolga++;
    if (s === "COMP") r.comp++;
    if (s === "FERIAS") r.ferias++;
    if (s === "AFAST") r.afast++;
    if (s === "FALTA") r.faltas++;
    if (s === "FER_TRAB_COMP") r.ferTrab++;
    if (s === "FER_TRAB_PAGO") r.ferPago++;
  });
  r.horas = Math.round(r.horas * 10) / 10;
  return r;
}
function alertas() {
  const A = [], R = E.regras, { G, equipe, dias, semanas, diasMes, meta } = calc;
  const add = (t, x) => A.push({ t, x });
  if (!equipe.length) return A;
  equipe.forEach(c => {
    if (Number(c.carga) > 42) add("err", `${c.nome}: ${c.carga}h por semana passa o limite de 42h da transição (EC 141/2026).`);
    else if (Number(c.carga) > Number(R.jornada)) add("warn", `${c.nome}: ${c.carga}h por semana, acima da jornada padrão da loja (${R.jornada}h).`);
  });
  semanas.forEach(sem => {
    if (!sem.some(d => d.dentro)) return;
    equipe.forEach(c => {
      const sts = sem.map(d => G[c.id][d.iso]?.st);
      if (sts.some(s => s === "FERIAS" || s === "AFAST")) return;
      const f = sts.filter(s => ehFolgaSemanal(s, R)).length;
      if (f < R.folgasSemana) add("err", `${c.nome}: semana de ${brC(sem[0].iso)} a ${brC(sem[6].iso)} com ${f} folga(s); o mínimo é ${R.folgasSemana}.`);
    });
  });
  equipe.forEach(c => {
    let seq = 0, avisado = false;
    dias.forEach(d => {
      if (ST[G[c.id][d.iso]?.st]?.trab) { seq++; if (seq > R.maxDias && !avisado && d.dentro) { add("err", `${c.nome}: ${seq} dias seguidos de trabalho até ${brC(d.iso)} (limite ${R.maxDias}).`); avisado = true; } }
      else seq = 0;
    });
    // descanso interjornada
    for (let i = 1; i < dias.length; i++) {
      const a = G[c.id][dias[i - 1].iso], b = G[c.id][dias[i].iso];
      if (dias[i].dentro && ST[a?.st]?.trab && ST[b?.st]?.trab && a.fim != null && b.ini != null) {
        const desc = (1440 - a.fim + b.ini) / 60;
        if (desc < R.descanso) { add("err", `${c.nome}: só ${fmtH(desc)} de descanso entre ${brC(dias[i - 1].iso)} e ${brC(dias[i].iso)} (mínimo ${R.descanso}h).`); break; }
      }
    }
  });
  // Cobertura abaixo do mínimo, agrupada por função (ou loja) e semana
  gruposDeficit().forEach(g => add("err", `${g.nome === "Loja" ? "Mínimo da loja" : `Função ${g.nome}`} abaixo do mínimo na semana de ${brC(g.sem[0])} a ${brC(g.sem[1])}: ${g.dias.map(x => `${DOW[x.dia.dow]} ${brC(x.iso)}${x.dia.fer ? " (feriado)" : ""} ${x.tem}/${x.min}`).join(", ")}.`));
  meta.folgaBloqueada.forEach(x => add("warn", `${nomeCol(x.colId)}: folga em ${DOW[parseISO(x.iso).getDay()]} ${brC(x.iso)}, dia bloqueado para folgas, por falta de outro dia possível.`));
  if (E.funcoes.some(f => f.minUtil || f.minFeriado) && equipe.some(c => !funcaoDe(c))) add("info", `Sem função cadastrada: ${equipe.filter(c => !funcaoDe(c)).map(c => c.nome).join(", ")}. Essas pessoas contam só para o mínimo geral.`);
  if (Object.values(E.horarios).some(h => h.aberto && h.abertura && !h.almocoSaida) && equipe.some(c => horasDiaCol(c) > 6))
    add("info", "Pausa de almoço não configurada em alguns dias: o sistema considera 1h de intervalo para jornadas acima de 6h.");
  E.trocas.forEach(t => { const a = colById(t.colA), b = colById(t.colB); if (a && b && a.carga !== b.carga) add("warn", `Troca de ${brC(t.data)}: ${a.nome} (${a.carga}h) e ${b.nome} (${b.carga}h) têm jornadas diferentes.`); });
  equipe.forEach(c => { const s = saldoCol(c.id).saldo; if (s > 0) add("info", `${c.nome}: ${s} folga(s) de feriado a compensar.`); if (s < 0) add("err", `${c.nome}: usou ${-s} compensação(ões) a mais do que tinha de crédito.`); });
  const ordem = { err: 0, warn: 1, info: 2 };
  return A.sort((a, b) => ordem[a.t] - ordem[b.t]);
}

function gruposDeficit() {
  const grupos = {};
  deficits().forEach(x => {
    const sem = calc.semanas.find(s => s.some(d => d.iso === x.iso));
    const k = `${x.funcaoId || "_"}|${sem[0].iso}`;
    (grupos[k] = grupos[k] || { nome: x.nome, sem: [sem[0].iso, sem[6].iso], dias: [] }).dias.push(x);
  });
  return Object.values(grupos);
}

  return ST[cel.st]?.label || cel.st;
}
const legendaHTML = () => `<div class="legend">${["TRAB", "FOLGA", "FER_FOLGA", "FER_TRAB_COMP", "FER_TRAB_PAGO", "COMP", "FECHADO", "FERIAS", "AFAST", "FALTA"].map(k => `<span><i class="${ST[k].cls}"></i>${ST[k].label}</span>`).join("")}<span><i style="background:#2563EB;border-radius:50%;width:8px;height:8px"></i>Ajuste manual</span><span><i style="background:#DB2777;border-radius:50%;width:8px;height:8px"></i>Troca</span></div>`;
function cabecalhoFolha(titulo, sub) {
  const e = E.empresa;
  const end = [e.logradouro && `${e.logradouro}${e.numero ? ", " + e.numero : ""}`, e.complemento, e.bairro, e.cidade && `${e.cidade}${e.uf ? "/" + e.uf : ""}`, e.cep && `CEP ${e.cep}`].filter(Boolean).join(" · ");
  return `<div class="sheet-h"><div class="logo">${logoHTML()}</div><div><h3>${esc(titulo)}</h3><p>${esc(e.razao || nomeEmp())}${e.cnpj ? " · CNPJ " + esc(e.cnpj) : ""}</p>${end ? `<p>${esc(end)}</p>` : ""}${sub ? `<p>${esc(sub)}</p>` : ""}</div></div>`;
}
const rodapeFolha = () => `<div class="sheet-foot"><span>Gerado pelo Eskla</span><span>${new Date().toLocaleString("pt-BR")}</span></div>`;
function semanasDoMes() {
  return calc.semanas.filter(s => s.some(d => d.dentro)).map((s, i) => ({ i, dias: s, label: `Semana ${i + 1} · ${brC(s[0].iso)} a ${brC(s[6].iso)}` }));
}
function imprimir(id, orient = "landscape") {
  const el = $(id); if (!el) return;
  $("pageStyle").textContent = `@page { size: A4 ${orient}; margin: 10mm; }`;
  el.classList.add("print-on"); document.body.classList.add("imprimindo");
  const fim = () => { el.classList.remove("print-on"); document.body.classList.remove("imprimindo"); window.removeEventListener("afterprint", fim); };
  window.addEventListener("afterprint", fim);
  window.print();
}
function vazioEquipe(msg = "Cadastre a equipe para gerar a escala.") {
  return `<div class="card"><div class="empty">${esc(msg)}<br><br><button class="btn-primary" onclick="ir('equipe')">Cadastrar equipe</button></div></div>`;
}

/* ============================================================
   TELAS
   ============================================================ */
const VIEWS = {};

VIEWS.painel = () => {
  const { G, equipe, diasMes } = calc;
  const A = alertas();
  const e = E.empresa;
  const passos = [
    [!!(e.fantasia || e.razao), "Cadastre os dados da empresa", "empresa"],
    [Object.values(E.horarios).some(h => h.abertura && h.fechamento), "Defina os horários de funcionamento", "funcionamento"],
    [E.equipe.length > 0, "Cadastre a equipe e a carga de cada um", "equipe"],
    [E.feriados.length > 0, "Lance os feriados do ano", "feriados"]
  ];
  const feitos = passos.filter(p => p[0]).length;
  const onb = feitos < passos.length ? `
    <div class="card onb">
      <div class="card-h"><div><h2>Primeiros passos</h2><div class="sub">Configure uma vez; a escala de todos os meses é gerada automaticamente.</div></div><span class="badge b-blue">${feitos} de ${passos.length}</span></div>
      <ol class="steps">${passos.map(([ok, t, v]) => `<li class="${ok ? "ok" : ""}"><span>${ok ? "✓" : ""}</span>${ok ? t : `<a href="#" onclick="ir('${v}');return false;" style="color:inherit">${t}</a>`}</li>`).join("")}</ol>
      ${!E.equipe.length ? `<div class="form-actions" style="justify-content:flex-start"><button class="btn-ghost" onclick="carregarExemplo()">Ver o sistema com dados de exemplo</button></div>` : ""}
    </div>` : "";

  const horasTot = equipe.reduce((s, c) => s + resumoCol(c).horas, 0);
  const abertos = diasMes.filter(d => d.aberto);
  const DEF = deficits(), diasDef = new Set(DEF.map(x => x.iso));
  const cobertos = abertos.filter(d => !diasDef.has(d.iso)).length;
  const pct = abertos.length ? Math.round(cobertos / abertos.length * 100) : 0;
  const nErr = A.filter(a => a.t === "err").length;
  const saldoTot = equipe.reduce((s, c) => s + Math.max(0, saldoCol(c.id).saldo), 0);
  const kpis = `<div class="kpis">
    <div class="kpi kb"><div class="kpi-l">Equipe ativa</div><div class="kpi-v">${equipe.length}</div><div class="kpi-h">${E.equipe.length} cadastrados · ${equipe.filter(c => c.domingo).length} no revezamento</div></div>
    <div class="kpi kb"><div class="kpi-l">Horas previstas no mês</div><div class="kpi-v">${Math.round(horasTot)}h</div><div class="kpi-h">soma da equipe</div></div>
    <div class="kpi ${!equipe.length ? "" : pct === 100 ? "ok" : pct >= 90 ? "warn" : "bad"}"><div class="kpi-l">Cobertura da loja</div><div class="kpi-v">${equipe.length ? pct + "%" : "—"}</div><div class="kpi-h">${cobertos} de ${abertos.length} dias abertos com o mínimo</div></div>
    <div class="kpi ${nErr ? "bad" : A.length ? "warn" : "ok"}"><div class="kpi-l">Alertas</div><div class="kpi-v">${A.length}</div><div class="kpi-h">${nErr} crítico(s)</div></div>
    <div class="kpi ${saldoTot ? "warn" : "ok"}"><div class="kpi-l">Folgas a compensar</div><div class="kpi-v">${saldoTot}</div><div class="kpi-h">feriados trabalhados pendentes</div></div>
  </div>`;
  if (!equipe.length) return onb + kpis + vazioEquipe();

  const sems = semanasDoMes();
  const vis = ui.filtro === "todas" ? diasMes : (sems[Number(ui.filtro)]?.dias.filter(d => d.dentro) || diasMes);
  const head = `<tr><th>Colaborador</th>${vis.map(d => `<th class="d ${d.fer ? "fer" : d.dow === 0 ? "dom" : ""}" title="${d.fer ? esc(d.fer.descricao) : ""}"><b>${pad(d.dia)}</b><small>${d.fer ? "FER" : DOW[d.dow]}</small></th>`).join("")}<th class="num">Horas</th></tr>`;
  const body = equipe.map(c => {
    const hrs = vis.reduce((s, d) => s + (ST[G[c.id][d.iso]?.st]?.trab ? Number(G[c.id][d.iso].horas) || 0 : 0), 0);
    return `<tr><td><div class="nome">${esc(c.nome)}</div><div class="meta">${esc(funcNome(c))} · ${c.carga}h/sem</div></td>${vis.map(d => {
      const cel = G[c.id][d.iso];
      return `<td><button class="cell ${ST[cel.st]?.cls || ""} ${cel.manual ? "manual" : ""} ${cel.troca ? "troca" : ""}" title="${esc(`${c.nome} · ${br(d.iso)}: ${textoCel(cel)}${cel.extra ? " (folga extra: limite de dias seguidos)" : ""}`)}" onclick="abrirModal('${c.id}','${d.iso}')">${esc(rotuloCel(cel))}</button></td>`;
    }).join("")}<td class="tot num">${fmtH(hrs)}</td></tr>`;
  }).join("");
  // Rodapé: total na loja e cada função com mínimo, no formato "tem/mínimo"
  const linhaCob = (titulo, sub, conta, minimo) => `<tr><td><div class="nome">${esc(titulo)}</div><div class="meta">${esc(sub)}</div></td>${vis.map(d => {
    if (!d.aberto) return `<td><span class="cov cx">—</span></td>`;
    const n = conta(d), m = minimo(d);
    return `<td><span class="cov ${n < m ? "c0" : "c2"}" title="${n} trabalhando · mínimo ${m}">${m ? `${n}/${m}` : n}</span></td>`;
  }).join("")}<td></td></tr>`;
  const trabEm = d => equipe.filter(c => ST[G[c.id][d.iso]?.st]?.trab);
  const foot = linhaCob("Na loja", "trabalhando / mínimo", d => trabEm(d).length, d => minimosDoDia(d).geral)
    + E.funcoes.filter(f => f.minUtil || f.minFeriado).map(f => linhaCob(f.nome, `função${f.setor ? " · " + f.setor : ""}`, d => trabEm(d).filter(c => c.funcaoId === f.id).length, d => minimosDoDia(d).porFuncao[f.id] || 0)).join("");
  const grupos = gruposDeficit();
  const destaque = grupos.length ? `<div class="card deficit"><div class="card-h"><div><h2>⚠ Cobertura abaixo do mínimo</h2><div class="sub">A escala não força folga a menos nem carga a mais para cobrir. Para resolver: ajuste manual, troca, nova contratação ou revisão dos mínimos.</div></div><span class="badge b-red">${DEF.length} ocorrência(s)</span></div>
    <ul class="alerts">${grupos.map(g => `<li class="al-err">● <span><b>${esc(g.nome === "Loja" ? "Mínimo geral da loja" : g.nome)}</b> — semana de ${brC(g.sem[0])} a ${brC(g.sem[1])}: ${g.dias.map(x => `${DOW[x.dia.dow]} ${brC(x.iso)}${x.dia.fer ? " (feriado)" : ""} com ${x.tem} de ${x.min}`).join(" · ")}</span></li>`).join("")}</ul></div>` : "";

  const resumo = equipe.map(c => { const r = resumoCol(c), s = saldoCol(c.id).saldo; return `<tr><td><b>${esc(c.nome)}</b></td><td class="num">${r.trab}</td><td class="num">${fmtH(r.horas)}</td><td class="num">${r.folgas + r.ferFolga}</td><td class="num">${r.domingos}</td><td class="num">${s > 0 ? `<span class="badge b-teal">${s}</span>` : s}</td></tr>`; }).join("");

  return `${onb}${kpis}${destaque}
  <div class="card" id="cardGrade">
    <div class="card-h">
      <div><h2>Escala de ${MESES[calc.mes - 1]} de ${calc.ano}</h2><div class="sub">Clique em um dia para ajustar. As linhas de baixo mostram quantos trabalham e o mínimo exigido: vermelho = abaixo do mínimo.</div></div>
      <div class="acts no-print">
        <select onchange="ui.filtro=this.value;render()" style="width:auto">${opt("todas", "Mês inteiro", ui.filtro)}${sems.map(s => opt(String(s.i), s.label, ui.filtro)).join("")}</select>
        ${Object.keys(E.ajustes).some(k => Object.keys(E.ajustes[k]).length) ? `<button class="btn-ghost" onclick="limparAjustes()">Limpar ajustes</button>` : ""}
        <button class="btn-ghost" onclick="imprimir('cardGrade')">Imprimir / PDF</button>
      </div>
    </div>
    <div class="tbl-wrap"><table class="grade"><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
    ${legendaHTML()}
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Alertas de conformidade e operação</h2><span class="badge ${nErr ? "b-red" : A.length ? "b-amber" : "b-green"}">${A.length} alerta(s)</span></div>
      <ul class="alerts">${A.length ? A.map(a => `<li class="al-${a.t}">${a.t === "err" ? "●" : a.t === "warn" ? "▲" : "i"} <span>${esc(a.x)}</span></li>`).join("") : `<li class="al-ok">✓ <span>Escala dentro das regras configuradas.</span></li>`}</ul>
    </div>
    <div class="card"><div class="card-h"><h2>Resumo do mês</h2><button class="btn-ghost btn-sm" onclick="ir('resumo')">Ver completo</button></div>
      <div class="tbl-wrap"><table><thead><tr><th>Colaborador</th><th class="num">Dias</th><th class="num">Horas</th><th class="num">Folgas</th><th class="num">Domingos</th><th class="num">A compensar</th></tr></thead><tbody>${resumo}</tbody></table></div>
    </div>
  </div>
  <p class="help">O Eskla organiza a escala operacional; não substitui a validação jurídica e contábil nem a convenção coletiva (CCT/ACT) da categoria.</p>`;
};

/* ---- Feriados ---- */
VIEWS.feriados = () => {
  const ano = Number(E.competencia.slice(0, 4));
  const lista = [...E.feriados].sort((a, b) => a.data.localeCompare(b.data));
  const linhas = lista.map(f => {
    let imp = `Folga para toda a equipe${E.regras.priorizarFeriadoFolga ? " (absorve uma folga da semana)" : " (descanso a mais na semana)"}`;
    if (f.tratamento !== "FOLGA") {
      const r = f.data.startsWith(E.competencia) ? calc : gerarEscala(E, f.data.slice(0, 7));
      const quem = Object.keys(r.G).filter(cid => ST[r.G[cid][f.data]?.st]?.trab).map(nomeCol);
      imp = (quem.length ? `Trabalha: ${quem.join(", ")}` : "Ninguém disponível") + (f.tratamento === "COMP" ? " → ganha folga compensatória" : " → recebe o dia em dobro");
    }
    return `<tr><td data-l="Data"><b>${br(f.data)}</b></td><td data-l="Dia">${DOW[parseISO(f.data).getDay()]}</td><td data-l="Feriado">${esc(f.descricao)}</td><td data-l="Abrangência">${esc(f.abrangencia)}</td>
      <td data-l="Tratamento"><select onchange="upd(e=>e.feriados.find(x=>x.id==='${f.id}').tratamento=this.value,true)">${Object.entries(TRAT_FER).map(([k, v]) => opt(k, v, f.tratamento)).join("")}</select></td>
      <td data-l="Impacto na escala"><span class="help" style="color:var(--ink-2)">${esc(imp)}</span></td><td><button class="btn-danger btn-sm" onclick="upd(e=>e.feriados=e.feriados.filter(x=>x.id!=='${f.id}'),true)">Excluir</button></td></tr>`;
  }).join("") || `<tr><td colspan="7" class="empty">Nenhum feriado cadastrado. Use o botão para carregar os nacionais e acrescente os do seu estado e município.</td></tr>`;
  return `<div class="card"><div class="card-h"><div><h2>Cadastrar feriado</h2><div class="sub">Defina se a loja fecha, ou se abre com revezamento e como o dia trabalhado é compensado.</div></div>
      <button class="btn-ghost" onclick="addNacionais(${ano})">+ Feriados nacionais de ${ano}</button></div>
    <div class="grid g4">
      <div class="field"><label for="fData">Data</label><input type="date" id="fData"></div>
      <div class="field"><label for="fDesc">Nome do feriado</label><input id="fDesc" placeholder="Ex.: Padroeira da cidade"></div>
      <div class="field"><label for="fAbr">Abrangência</label><select id="fAbr">${["Nacional", "Estadual", "Municipal", "Convenção coletiva"].map(x => opt(x, x)).join("")}</select></div>
      <div class="field"><label for="fTrat">Tratamento na escala</label><select id="fTrat">${Object.entries(TRAT_FER).map(([k, v]) => opt(k, v)).join("")}</select></div>
    </div>
    <div class="form-actions"><button class="btn-primary" onclick="addFeriado()">+ Adicionar feriado</button></div></div>
  <div class="card"><div class="card-h"><h2>Feriados cadastrados</h2><span class="badge b-blue">${E.feriados.length}</span></div>
    <div class="tbl-wrap"><table class="stack"><thead><tr><th>Data</th><th>Dia</th><th>Feriado</th><th>Abrangência</th><th>Tratamento</th><th>Impacto na escala</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>
    <p class="help" style="margin-top:10px">Revezamento: o sistema escala primeiro o mínimo de feriado de cada função (Funções), depois completa o mínimo da linha “Feriado” (Funcionamento), em revezamento; os demais ficam de folga. Se o feriado cair num dia com folga bloqueada, o bloqueio não vale nesse dia. Para trabalho em feriado no comércio, confira a autorização na convenção coletiva.</p></div>`;
};
function addFeriado() {
  const data = $("fData").value; if (!data) return toast("Informe a data do feriado.");
  if (E.feriados.some(f => f.data === data)) return toast("Já existe um feriado nessa data.");
  upd(e => e.feriados.push({ id: uid("fer"), data, descricao: $("fDesc").value.trim() || "Feriado", abrangencia: $("fAbr").value, tratamento: $("fTrat").value }), true);
  toast("Feriado adicionado e escala recalculada.");
}
function addNacionais(ano) {
  let n = 0;
  feriadosNacionais(ano).forEach(([data, descricao]) => { if (!E.feriados.some(f => f.data === data)) { E.feriados.push({ id: uid("fer"), data, descricao, abrangencia: "Nacional", tratamento: "FOLGA" }); n++; } });
  salvar(); render(); toast(n ? `${n} feriado(s) nacional(is) adicionado(s).` : "Os feriados nacionais já estavam cadastrados.");
}

/* ---- Trocas ---- */
VIEWS.trocas = () => {
  if (E.equipe.filter(c => c.status === "Ativo").length < 2) return vazioEquipe("Cadastre pelo menos duas pessoas ativas para registrar trocas.");
  const linhas = [...E.trocas].sort((a, b) => a.data.localeCompare(b.data)).map(t => {
    const r = t.data.startsWith(E.competencia) ? calc : gerarEscala(E, t.data.slice(0, 7));
    const a = r.G[t.colA]?.[t.data], b = r.G[t.colB]?.[t.data];
    const conf = [];
    if (!a || !b) conf.push("Colaborador inativo ou removido");
    if ([a?.st, b?.st].some(s => s === "FERIAS" || s === "AFAST")) conf.push("Envolve pessoa de férias/afastada");
    const ca = colById(t.colA)?.carga, cb = colById(t.colB)?.carga;
    if (ca && cb && ca !== cb) conf.push(`Jornadas diferentes (${ca}h × ${cb}h)`);
    const imp = a && b ? `${nomeCol(t.colA)}: ${textoCel(a)} · ${nomeCol(t.colB)}: ${textoCel(b)}` : "—";
    return `<tr><td data-l="Data"><b>${br(t.data)}</b></td><td data-l="Colaboradores">${esc(nomeCol(t.colA))} ⇄ ${esc(nomeCol(t.colB))}</td><td data-l="Motivo">${esc(t.motivo || "—")}</td>
      <td data-l="Impacto na escala"><span class="help" style="color:var(--ink-2)">${esc(imp)}</span></td><td data-l="Situação">${conf.length ? `<span class="badge b-amber">${esc(conf.join(" · "))}</span>` : `<span class="badge b-green">OK</span>`}</td>
      <td><button class="btn-danger btn-sm" onclick="upd(e=>e.trocas=e.trocas.filter(x=>x.id!=='${t.id}'),true)">Excluir</button></td></tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">Nenhuma troca registrada.</td></tr>`;
  return `<div class="card"><div class="card-h"><div><h2>Registrar troca</h2><div class="sub">Os dois colaboradores trocam entre si o que estava previsto para o dia (turno ou folga).</div></div></div>
    <div class="grid g4">
      <div class="field"><label for="tData">Data</label><input type="date" id="tData"></div>
      <div class="field"><label for="tA">Colaborador 1</label><select id="tA">${optsEquipe()}</select></div>
      <div class="field"><label for="tB">Colaborador 2</label><select id="tB">${optsEquipe(E.equipe.filter(c => c.status === "Ativo")[1]?.id)}</select></div>
      <div class="field"><label for="tMot">Motivo</label><input id="tMot" placeholder="Ex.: consulta médica"></div>
    </div><div class="form-actions"><button class="btn-primary" onclick="addTroca()">+ Registrar troca</button></div></div>
  <div class="card"><div class="card-h"><h2>Trocas registradas</h2><span class="badge b-blue">${E.trocas.length}</span></div>
    <div class="tbl-wrap"><table class="stack"><thead><tr><th>Data</th><th>Colaboradores</th><th>Motivo</th><th>Impacto na escala</th><th>Situação</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div></div>`;
};
function addTroca() {
  const data = $("tData").value, a = $("tA").value, b = $("tB").value;
  if (!data) return toast("Informe a data da troca.");
  if (!a || !b || a === b) return toast("Escolha dois colaboradores diferentes.");
  upd(e => e.trocas.push({ id: uid("tr"), data, colA: a, colB: b, motivo: $("tMot").value.trim() }), true);
  toast("Troca registrada.");
}

/* ---- Férias e ausências ---- */
VIEWS.ocorrencias = () => {
  if (!E.equipe.length) return vazioEquipe();
  const linhas = [...E.ocorrencias].sort((a, b) => a.inicio.localeCompare(b.inicio)).map(o => {
    const n = Math.round((parseISO(o.fim) - parseISO(o.inicio)) / 864e5) + 1;
    const imp = o.tipo === "FALTA" ? "Dia descontado; verificar perda do repouso da semana na folha" : `${n} dia(s) fora · folgas e domingos redistribuídos entre os demais`;
    const b = o.tipo === "FERIAS" ? "b-blue" : o.tipo === "AFAST" ? "b-red" : "b-amber";
    return `<tr><td data-l="Colaborador"><b>${esc(nomeCol(o.colId))}</b></td><td data-l="Tipo"><span class="badge ${b}">${TIPOS_OC[o.tipo]}</span></td><td data-l="Período">${br(o.inicio)}${o.fim !== o.inicio ? " a " + br(o.fim) : ""}</td><td data-l="Dias" class="num">${n}</td>
      <td data-l="Motivo">${esc(o.motivo || "—")}</td><td data-l="Impacto"><span class="help" style="color:var(--ink-2)">${imp}</span></td><td><button class="btn-danger btn-sm" onclick="upd(e=>e.ocorrencias=e.ocorrencias.filter(x=>x.id!=='${o.id}'),true)">Excluir</button></td></tr>`;
  }).join("") || `<tr><td colspan="7" class="empty">Nenhuma ocorrência lançada.</td></tr>`;
  return `<div class="card"><div class="card-h"><div><h2>Lançar férias ou ausência</h2><div class="sub">Ao lançar férias ou afastamento, o sistema tira a pessoa da escala e reorganiza folgas e domingos dos demais.</div></div></div>
    <div class="grid g4">
      <div class="field"><label for="oCol">Colaborador</label><select id="oCol">${optsEquipe(null, false)}</select></div>
      <div class="field"><label for="oTipo">Tipo</label><select id="oTipo">${Object.entries(TIPOS_OC).map(([k, v]) => opt(k, v)).join("")}</select></div>
      <div class="field"><label for="oIni">Início</label><input type="date" id="oIni"></div>
      <div class="field"><label for="oFim">Fim</label><input type="date" id="oFim"><span class="help">Em branco = um dia só.</span></div>
      <div class="field span-2"><label for="oMot">Motivo / observação</label><input id="oMot" placeholder="Ex.: férias do período 2025/2026, atestado de 3 dias…"></div>
    </div><div class="form-actions"><button class="btn-primary" onclick="addOcorrencia()">+ Lançar</button></div></div>
  <div class="card"><div class="card-h"><h2>Ocorrências lançadas</h2><span class="badge b-blue">${E.ocorrencias.length}</span></div>

function addComp() {

const mascCNPJ = v => v.replace(/\D/g, "").slice(0, 14).replace(/^(\d{2})(\d)/, "$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1/$2").replace(/(\d{4})(\d)/, "$1-$2");
const mascCEP = v => v.replace(/\D/g, "").slice(0, 8).replace(/^(\d{5})(\d)/, "$1-$2");
const mascTel = v => { const n = v.replace(/\D/g, "").slice(0, 11); return n.length > 10 ? n.replace(/^(\d{2})(\d{5})(\d{0,4})/, "($1) $2-$3") : n.replace(/^(\d{2})(\d{4})(\d{0,4})/, "($1) $2-$3").replace(/^(\d{2})(\d{0,4})$/, "($1) $2"); };
function cnpjValido(v) {
  const n = String(v).replace(/\D/g, "");
  if (n.length !== 14 || /^(\d)\1+$/.test(n)) return false;
  const dig = l => { let s = 0, p = l - 7; for (let i = 0; i < l; i++) { s += Number(n[i]) * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; };
  return dig(12) === Number(n[12]) && dig(13) === Number(n[13]);
}
function validarCNPJ(el) {
  const ok = !el.value || cnpjValido(el.value);
  el.classList.toggle("invalid", !ok);
  $("cnpjMsg").textContent = ok ? "Os dígitos verificadores são conferidos." : "CNPJ inválido — confira os números.";
  $("cnpjMsg").style.color = ok ? "" : "var(--red-tx)";
  upd(x => x.empresa.cnpj = el.value);
}
function carregarLogo(ev) {
  const file = ev.target.files?.[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = 256, cv = document.createElement("canvas"), k = Math.min(1, s / Math.max(img.width, img.height));
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      upd(x => x.empresa.logo = cv.toDataURL("image/png"), true); toast("Imagem atualizada.");
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file); ev.target.value = "";
}

function copiarSegunda() {

/* ---- Funções ---- */

      <td data-l="Mín. dia útil"><input type="number" min="0" max="50" value="${f.minUtil}" style="width:70px" onchange="upd(e=>e.funcoes[${i}].minUtil=Math.max(0,Number(this.value)||0),true)"></td>
      <td data-l="Mín. feriado"><input type="number" min="0" max="50" value="${f.minFeriado}" style="width:70px" onchange="upd(e=>e.funcoes[${i}].minFeriado=Math.max(0,Number(this.value)||0),true)"></td>
      <td data-l="Pessoas ativas" class="num">${n}${maior > n ? ` <span class="badge b-red" title="Menos pessoas que o mínimo: não há como cobrir todos os dias com 2 folgas por semana">poucas</span>` : ""}</td>

  return `<div class="card"><div class="card-h"><div><h2>Funções</h2><div class="sub">O motor escala primeiro o mínimo de cada função, depois completa o mínimo geral do dia e só então distribui as folgas.</div></div>
      <button class="btn-primary" onclick="addFuncao()">+ Nova função</button></div>

    <div class="help" style="margin-top:10px;display:grid;gap:4px">
      <span><b>Janelas</b> são faixas em que a função pode trabalhar (ex.: 04:00–10:00 e 13:00–18:00), não um horário fixo: o sistema encaixa a carga diária de cada pessoa nelas e usa o espaço entre duas janelas como intervalo. Sem janela, vale o horário da loja.</span>

    </div></div>`;
};
function addFuncao() {
  upd(e => e.funcoes.push(novaFuncao(`Função ${e.funcoes.length + 1}`)), true);
  setTimeout(() => { const ins = document.querySelectorAll("#view tbody tr:last-child input"); ins[0]?.focus(); ins[0]?.select(); }, 30);
}
function addJanela(i) {
  const ini = $(`tIni${i}`).value, fim = $(`tFim${i}`).value;
  if (!ini || !fim) return toast("Informe início e fim da janela.");
  if (toMin(fim) <= toMin(ini)) return toast("O fim da janela precisa ser depois do início.");
  upd(e => { e.funcoes[i].turnos.push({ ini, fim }); e.funcoes[i].turnos.sort((a, b) => a.ini.localeCompare(b.ini)); }, true);
}
function removerFuncao(i) {
  const f = E.funcoes[i], n = E.equipe.filter(c => c.funcaoId === f.id).length;
  if (n && !confirm(`${n} colaborador(es) estão em "${f.nome}". Excluir mesmo assim? Eles ficarão sem função.`)) return;
  upd(e => { e.equipe.forEach(c => { if (c.funcaoId === f.id) c.funcaoId = ""; }); e.funcoes.splice(i, 1); }, true);
}

function addCol() {

/* ---------------- Ajuste manual ---------------- */
function abrirModal(cid, iso) {
  const c = colById(cid), cel = calc.G[cid][iso];
  ui.modal = { cid, iso };
  $("mTitulo").textContent = `${c.nome} · ${DOW[parseISO(iso).getDay()]} ${br(iso)}`;
  $("mStatus").innerHTML = Object.entries(ST).map(([k, v]) => opt(k, v.label, cel.st)).join("");
  $("mHorario").value = cel.horario || "";
  $("mHoras").value = cel.horas || 0;
  $("modal").classList.add("open");
}
function sugerirModal() {
  const st = $("mStatus").value;
  if (!ST[st].trab) { $("mHoras").value = 0; $("mHorario").value = ""; }
  else if (!Number($("mHoras").value)) { const c = colById(ui.modal.cid); $("mHoras").value = horasDiaCol(c); }
}
function salvarAjuste() {
  const { cid, iso } = ui.modal, st = $("mStatus").value;
  const h = $("mHorario").value.trim().replace(/\s*[-–a]\s*/, "–");
  const m = h.match(/^(\d{1,2}:\d{2})–(\d{1,2}:\d{2})$/);
  upd(e => { (e.ajustes[cid] = e.ajustes[cid] || {})[iso] = { st, horario: ST[st].trab ? (h || fmtH(Number($("mHoras").value))) : "", horas: ST[st].trab ? Number($("mHoras").value) || 0 : 0, ini: m ? toMin(m[1]) : null, fim: m ? toMin(m[2]) : null }; }, true);
  fecharModal(); toast("Dia ajustado manualmente.");
}
function removerAjuste() { const { cid, iso } = ui.modal; upd(e => { if (e.ajustes[cid]) delete e.ajustes[cid][iso]; }, true); fecharModal(); toast("Dia voltou para o automático."); }
function fecharModal() { $("modal").classList.remove("open"); ui.modal = null; }
function limparAjustes() { if (!confirm("Remover todos os ajustes manuais desta empresa?")) return; upd(e => e.ajustes = {}, true); toast("Ajustes removidos."); }

/* ---------------- Empresas, backup e exemplo ---------------- */
function trocarEmpresa(id) { E = normalizar(S.empresas[id]); S.ativa = id; ui.col = null; ui.semana = 0; ui.filtro = "todas"; salvar(); render(); }
function criarEmpresa() { const e = novaEmpresa(); S.empresas[e.id] = e; trocarEmpresa(e.id); ir("empresa"); toast("Nova empresa criada. Preencha os dados."); }
function excluirEmpresa() {
  if (!confirm(`Excluir "${nomeEmp()}" e todos os dados dela? Esta ação não pode ser desfeita. Exporte o backup antes, se precisar.`)) return;
  delete S.empresas[E.id];
  if (!Object.keys(S.empresas).length) { const e = novaEmpresa(); S.empresas[e.id] = e; }
  trocarEmpresa(Object.keys(S.empresas)[0]); ir("painel");
}
function exportarJSON() {
  const blob = new Blob([JSON.stringify({ tipo: "eskla-empresa", versao: 2, empresa: E }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `eskla-${(nomeEmp()).toLowerCase().normalize("NFD").replace(/[^\w]+/g, "-")}-${E.competencia}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 500); toast("Backup exportado.");
}
function importarJSON(ev) {
  const file = ev.target.files?.[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result);
      const emp = j.empresa && j.empresa.equipe ? j.empresa : (j.equipe ? j : null);
      if (!emp) throw 0;
      emp.id = uid("emp"); S.empresas[emp.id] = normalizar(emp); trocarEmpresa(emp.id); toast("Backup importado como nova empresa.");
    } catch { toast("Arquivo inválido: não é um backup do Eskla."); }
  };
  rd.readAsText(file); ev.target.value = "";
}

  e.equipe = [["Ana", fAt, 42], ["Bruno", fAt, 42], ["Carla", fCx, 40], ["Diego", fAt, 40], ["Elisa", fRt, 42, false], ["Fábio", fCx, 40]]
    .map(([nome, f, carga, dom = true]) => ({ id: uid("col"), nome, funcaoId: f.id, carga, domingo: dom, status: "Ativo", telefone: "" }));
  e.feriados = feriadosNacionais(ano).map(([data, descricao]) => ({ id: uid("fer"), data, descricao, abrangencia: "Nacional", tratamento: "FOLGA" }));
  const fm = e.feriados.filter(f => f.data.startsWith(mes) && parseISO(f.data).getDay() !== 0);
  if (fm[0]) fm[0].tratamento = "COMP"; if (fm[1]) fm[1].tratamento = "PAGO";
  e.ocorrencias = [{ id: uid("oc"), colId: e.equipe[2].id, tipo: "FERIAS", inicio: `${mes}-16`, fim: `${mes}-25`, motivo: "Férias (exemplo)" }];
  S.empresas[e.id] = e; trocarEmpresa(e.id); ir("painel"); toast("Empresa de exemplo criada — dados fictícios.");
}
